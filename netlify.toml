# The viewer is a single self-contained static file - no build step required.
[build]
  publish = "viewer"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Single-page app: everything resolves to the viewer.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
