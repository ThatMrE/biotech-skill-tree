uffer","casting tray & comb","DC power supply","DNA ladder","loading dye","DNA stain"],"estimatatedTime":{"setup":15,"config":30,"testing":30},"instructions":[{"title":"Pour the gel","description":"Melt agarose in TAE, cool to ~50C, add stain if pre-staining, pour and add the comb. Tape leaky chambers."},{"title":"Prep samples","description":"Spot running dye on parafilm and mix each DNA sample into a dot; keep dots well separated."},{"title":"Load carefully","description":"Steady both elbows, lower the tip into the well, depress slowly. Lift a little buffer to avoid tails. Change tips between samples - especially ladders."},{"title":"Run to red","description":"Place wells near the black (negative) electrode; DNA migrates to red (positive). Stop before the dye runs off."}]},"submission":{"description":"Run a gel with a ladder and at least one sample. Submit a labelled gel image and estimate the fragment sizes."},"resources":[{"title":"NeoSynBio: Agarose Gel Electrophoresis protocol","url":"https://www.neosynbio.com/agarose-electrophoresis"},{"title":"Addgene: How to run an agarose gel (protocol & video)","url":"https://www.addgene.org/protocols/gel-electrophoresis/"},{"title":"Addgene: Purifying DNA from an agarose gel","url":"https://www.addgene.org/protocols/gel-purification/"},{"title":"Bio-Rad: Sub-Cell GT agarose gel electrophoresis manual","url":"https://www.bio-rad.com/sites/default/files/webroot/web/pdf/lsr/literature/M1704400B.PDF"}]},"gel-imaging":{"treeId":"synthetic-biology","id":"gel-imaging","title":{"name":"gel illumination & photography","level":3},"project":"Analysis Core","video":{"url":""},"time":30,"level":"beginner","overview":{"description":"You don't need a fancy transilluminator - a few LEDs, a black enclosure box and a smartphone can beat institutional kit. A badly lit photo of a perfect gel still looks terrible, so this step is as critical as running the gel.","objectives":["choose the right illumination for your stain","build a cheap enclosure + filter for a smartphone camera","avoid the classic gel-dropping tragedy"],"prerequisites":["a stained gel","a light source"]},"steps":{"description":"You don't need a fancy transilluminator - a few LEDs, a black enclosure box and a smartphone can beat institutional kit. A badly lit photo of a perfect gel still looks terrible, so this step is as critical as running the gel.","intro":"You don't need a fancy transilluminator - a few LEDs, a black enclosure box and a smartphone can beat institutional kit. A badly lit photo of a perfect gel still looks terrible, so this step is as critical as running the gel.","tools":["UV or blue-light source","orange/amber filter","dark enclosure","smartphone camera"],"estimatatedTime":{"setup":5,"config":10,"testing":10},"instructions":[{"title":"Match light to stain","description":"Use the excitation wavelength your stain requires (UV for EtBr, blue light for many safer stains)."},{"title":"Build an enclosure","description":"Use a 3D-printed or cardboard black box with an orange filter over the camera to cut glare."},{"title":"Carry the gel carefully","description":"Everyone drops one eventually - support the gel fully on its way to the imager."}]},"submission":{"description":"Submit a clean, well-exposed gel photo with the lanes and ladder clearly readable."},"resources":[{"title":"NeoSynBio: Gel Illumination & Photography","url":"https://www.neosynbio.com/gel-illumination-photography"},{"title":"Flowers for Everyone (Sebastian S. Cocioba) - DIY synbio blog","url":"https://docs.google.com/document/d/10Y4NgXjMRvG_Vd5D4o2lPJp1ehY2R516gpfrh2PZWfw/edit"},{"title":"Bio-Rad: gel documentation fundamentals","url":"https://www.bio-rad.com/en-us/applications-technologies/gel-documentation"}]},"genetic-circuits":{"treeId":"synthetic-biology","id":"genetic-circuits","title":{"name":"genetic circuits","level":7},"project":"Systems & Circuits","video":{"url":""},"time":180,"level":"advanced","overview":{"description":"Wire standardised biological parts - promoters, RBSs, repressors, recombinases - into circuits that sense, compute, and actuate. Standardised assembly (MoClo / Golden Gate) makes parts composable; design tools like Cello compile Boolean logic into DNA.","objectives":["design a genetic logic gate (NOT/NOR/AND) from characterised parts","use standardised parts + hierarchical assembly (MoClo)","predict circuit behaviour and choose reporters to characterise it","reason about load, retroactivity, and part context effects"],"prerequisites":["Golden Gate / Gibson assembly","Plasmids 101"]},"steps":{"description":"Pick characterised parts, compose them into a logic function, assemble the DNA with a standardised method, and characterise the transfer function with reporters.","intro":"A genetic circuit is a program written in DNA: repressors and promoters form gates, and standardised assembly lets you snap validated parts together predictably.","tools":["a parts registry (iGEM Registry / SynBioHub)","MoClo / Golden Gate kit","Cello or similar circuit-design software","fluorescent reporters + plate reader"],"estimatatedTime":{"setup":40,"config":80,"testing":60},"instructions":[{"title":"Specify the logic","description":"Write the truth table you want (e.g. IPTG AND aTc gives GFP). Choose inputs (inducible promoters) and an output reporter."},{"title":"Choose characterised parts","description":"Select promoters, RBSs, and repressors with known strengths from a registry so behaviour is predictable."},{"title":"Compile & assemble","description":"Use Cello to map logic to a gate layout, then build with MoClo/Golden Gate hierarchical assembly."},{"title":"Characterise","description":"Measure the transfer function with reporters across input combinations; check for load and context effects, and debug part-by-part."}]},"submission":{"description":"Design a small genetic logic circuit, specify its parts and assembly plan, and describe the reporter experiment that would confirm the intended truth table."},"resources":[{"title":"HTGAA - Genetic Circuits (Weeks 6-7)","url":"https://2026a.htgaa.org/"},{"title":"iGEM Registry of Standard Biological Parts","url":"https://parts.igem.org/"},{"title":"Cello - genetic circuit design automation","url":"https://www.cidarlab.org/cello"},{"title":"SynBioHub - parts & designs repository","url":"https://synbiohub.org/"}]},"genomic-dna":{"treeId":"synthetic-biology","id":"genomic-dna","title":{"name":"purification of genomic dna","level":2},"project":"DNA Extraction","video":{"url":""},"time":90,"level":"intermediate","overview":{"description":"Genomic DNA is the organism's core code. For E. coli, a simple boil-purification in a heat block extracts the 4.6 Mbp chromosome. But chromosomes are hard to get back into cells - which is why plasmids are the real workhorse of synbio.","objectives":["match an extraction method to your genome type","perform a simple boil-prep for E. coli genomic DNA","understand why chromosomes are hard to reintroduce into cells"],"prerequisites":["DNA101","sterile technique","a heat block"]},"steps":{"description":"Genomic DNA is the organism's core code. For E. coli, a simple boil-purification in a heat block extracts the 4.6 Mbp chromosome. But chromosomes are hard to get back into cells - which is why plasmids are the real workhorse of synbio.","intro":"Genomic DNA is the organism's core code. For E. coli, a simple boil-purification in a heat block extracts the 4.6 Mbp chromosome. But chromosomes are hard to get back into cells - which is why plasmids are the real workhorse of synbio.","tools":["heat block","microcentrifuge","lysis reagents","E. coli culture"],"estimatatedTime":{"setup":15,"config":30,"testing":30},"instructions":[{"title":"Pick a method for your genome","description":"Choose an extraction protocol that matches your genome type (ssDNA, dsDNA, etc.)."},{"title":"Boil-prep E. coli","description":"For a quick crude prep, pellet cells, resuspend, and heat in a heat block to release genomic DNA."},{"title":"Plan downstream use","description":"Decide what you'll do with the DNA before extracting - reintroducing whole chromosomes is rarely practical."}]},"submission":{"description":"Extract genomic DNA from your host and run a small aliquot on a gel (after the gel node) to confirm high-molecular-weight DNA."},"resources":[{"title":"NeoSynBio: Genomic DNA Extraction protocols","url":"https://www.neosynbio.com/purification-of-genomic-dna"},{"title":"protocols.io: genomic / HMW DNA extraction","url":"https://www.protocols.io/"},{"title":"Addgene: DNA quantification with a spectrophotometer","url":"https://www.addgene.org/protocols/dna-quantification/"}]},"gibson":{"treeId":"synthetic-biology","id":"gibson","title":{"name":"gibson assembly","level":6},"project":"Advanced Assembly","video":{"url":"https://www.youtube.com/watch?v=tlVbf5fXhp4"},"time":120,"level":"advanced","overview":{"description":"Gibson Assembly replaces digest+ligation with a single isothermal reaction that joins fragments via homologous overlapping ends - reportedly up to 6 at once. Most of the work is primer design for scarless overlaps, so revise that first.","objectives":["design primers with homologous overlaps","assemble multiple fragments in one isothermal reaction","decide when to switch from RE digest to single-step cloning"],"prerequisites":["Primer Design","Flanking Sequence Addition"]},"steps":{"description":"Gibson Assembly replaces digest+ligation with a single isothermal reaction that joins fragments via homologous overlapping ends - reportedly up to 6 at once. Most of the work is primer design for scarless overlaps, so revise that first.","intro":"Gibson Assembly replaces digest+ligation with a single isothermal reaction that joins fragments via homologous overlapping ends - reportedly up to 6 at once. Most of the work is primer design for scarless overlaps, so revise that first.","tools":["Gibson assembly master mix","PCR fragments with overlaps","thermocycler"],"estimatatedTime":{"setup":20,"config":40,"testing":40},"instructions":[{"title":"Design overlaps","description":"Design ~20-40 bp homologous overlaps between adjacent fragments using your assembly wizard."},{"title":"Amplify fragments","description":"PCR each fragment with the overlap-adding primers; gel-confirm sizes."},{"title":"Assemble","description":"Combine fragments with the master mix and incubate at 50C; transform directly."}]},"submission":{"description":"Assemble a multi-fragment construct by Gibson and confirm it by colony PCR or sequencing."},"resources":[{"title":"NeoSynBio: Gibson Assembly","url":"https://www.neosynbio.com/gibson-assembly"},{"title":"NEB: Gibson Assembly overview & protocol","url":"https://www.neb.com/en-us/applications/cloning-and-synthetic-biology/dna-assembly-and-cloning/gibson-assembly"},{"title":"Addgene: choosing a molecular cloning technique","url":"https://blog.addgene.org/plasmids-101-sequence-and-ligation-independent-cloning"},{"title":"Benchling: Gibson assembly wizard","url":"https://www.benchling.com/"}]},"golden-gate":{"treeId":"synthetic-biology","id":"golden-gate","title":{"name":"golden gate assembly","level":6},"project":"Advanced Assembly","video":{"url":"https://www.youtube.com/watch?v=NzQdLQ44I7w"},"time":120,"level":"advanced","overview":{"description":"Golden Gate uses Type IIS enzymes (which cut outside their recognition site) to create scarless, directional, one-tube assemblies of 10+ fragments. Because cut sites are removed during assembly, ligation can proceed immediately - no purification step.","objectives":["use Type IIS enzymes that cut outside their recognition site","design fragments without internal recognition sites ('domestication')","assemble many ordered fragments in one reaction"],"prerequisites":["Restriction Digest","Flanking Sequence Addition"]},"steps":{"description":"Golden Gate uses Type IIS enzymes (which cut outside their recognition site) to create scarless, directional, one-tube assemblies of 10+ fragments. Because cut sites are removed during assembly, ligation can proceed immediately - no purification step.","intro":"Golden Gate uses Type IIS enzymes (which cut outside their recognition site) to create scarless, directional, one-tube assemblies of 10+ fragments. Because cut sites are removed during assembly, ligation can proceed immediately - no purification step.","tools":["Type IIS enzyme (BsaI/BsmBI)","T4 ligase","fragments with designed overhangs","thermocycler"],"estimatatedTime":{"setup":20,"config":40,"testing":40},"instructions":[{"title":"Design overhangs","description":"Place Type IIS sites so digestion leaves unique 4 nt overhangs that define fragment order."},{"title":"Domesticate fragments","description":"Remove internal recognition sites via silent mutations so only the designed sites are cut."},{"title":"Cycle digest-ligate","description":"Run alternating digest/ligation cycles in one tube, then transform."}]},"submission":{"description":"Assemble an ordered multi-part construct by Golden Gate and confirm correct assembly by screening."},"resources":[{"title":"NeoSynBio: Golden Gate Assembly","url":"https://www.neosynbio.com/golden-gate-assembly"},{"title":"NEB: Golden Gate Assembly overview & protocol","url":"https://www.neb.com/en-us/applications/cloning-and-synthetic-biology/dna-assembly-and-cloning/golden-gate-assembly"},{"title":"Addgene: Plasmids 101 - Golden Gate cloning","url":"https://blog.addgene.org/plasmids-101-golden-gate-cloning"}]},"gradient-pcr":{"treeId":"synthetic-biology","id":"gradient-pcr","title":{"name":"gradient pcr","level":4},"project":"Amplification","video":{"url":""},"time":60,"level":"intermediate","overview":{"description":"A gradient thermocycler runs the same reaction at a different temperature per column, testing up to 12 annealing temperatures at once. Without one, you can run the same reaction day after day - a gradient cycler is a quality-of-life upgrade worth scouting university surplus for.","objectives":["use a temperature gradient to optimise annealing","interpret a gradient gel to pick the best Tm","substitute day-by-day runs if you lack a gradient cycler"],"prerequisites":["a primer pair","ideally a gradient thermocycler"]},"steps":{"description":"A gradient thermocycler runs the same reaction at a different temperature per column, testing up to 12 annealing temperatures at once. Without one, you can run the same reaction day after day - a gradient cycler is a quality-of-life upgrade worth scouting university surplus for.","intro":"A gradient thermocycler runs the same reaction at a different temperature per column, testing up to 12 annealing temperatures at once. Without one, you can run the same reaction day after day - a gradient cycler is a quality-of-life upgrade worth scouting university surplus for.","tools":["gradient thermocycler (ideal)","primers","template","polymerase"],"estimatatedTime":{"setup":10,"config":20,"testing":20},"instructions":[{"title":"Set the gradient","description":"Program a temperature gradient spanning ~5-10C around your predicted Tm."},{"title":"Run & gel","description":"Run all columns, then load each on a gel side by side."},{"title":"Pick the winner","description":"Choose the temperature giving the strongest specific band with the least non-specific product."}]},"submission":{"description":"Submit a gradient gel image and state the optimal annealing temperature you'll use going forward."},"resources":[{"title":"NeoSynBio: Gradient PCR","url":"https://www.neosynbio.com/gradient-pcr"},{"title":"NEB Tm Calculator (gradient planning)","url":"https://tmcalculator.neb.com/"},{"title":"Bio-Rad: PCR temperature optimization","url":"https://www.bio-rad.com/en-us/applications-technologies/pcr-optimization"}]},"host-selection":{"treeId":"synthetic-biology","id":"host-selection","title":{"name":"host selection criteria","level":1},"project":"Experimental Design","video":{"url":""},"time":30,"level":"beginner","overview":{"description":"Pick a simple single-celled organism that can hold and use a plasmid - bacteria or yeast. Use a well-characterised, non-pathogenic strain from a respected supplier. K12-derived E. coli is the well-trodden, easy-to-approve path.","objectives":["choose a non-pathogenic, plasmid-compatible host","weigh the trade-offs of well-characterised vs novel organisms","verify the legality of working with your chosen organism"],"prerequisites":["the intro node"]},"steps":{"description":"Pick a simple single-celled organism that can hold and use a plasmid - bacteria or yeast. Use a well-characterised, non-pathogenic strain from a respected supplier. K12-derived E. coli is the well-trodden, easy-to-approve path.","intro":"Pick a simple single-celled organism that can hold and use a plasmid - bacteria or yeast. Use a well-characterised, non-pathogenic strain from a respected supplier. K12-derived E. coli is the well-trodden, easy-to-approve path.","tools":["literature databases","your local regulator's website"],"estimatatedTime":{"setup":5,"config":10,"testing":10},"instructions":[{"title":"Default to E. coli","description":"Unless you have a reason not to, choose a K12-derived E. coli strain. Decades of literature make culturing and troubleshooting far easier."},{"title":"Confirm it's non-pathogenic","description":"Never work with a strain that could infect you. Source from ATCC, DSMZ, a university, or iGEM."},{"title":"Check the law","description":"Google your government's stance on genetic manipulation and, if unsure, call the regulator. In Australia this is the OGTR."}]},"submission":{"description":"State your chosen host, its source/strain designation, and a one-line confirmation that it is legal to work with in your jurisdiction."},"resources":[{"title":"NeoSynBio: Host Selection Criteria","url":"https://www.neosynbio.com/host-selection-criteria"},{"title":"Addgene: Plasmids 101 eBook (host & vector basics)","url":"https://blog.addgene.org/plasmids-101-ebook-4th-edition"},{"title":"ATCC microbial strain catalogue","url":"https://www.atcc.org/microbe-products"},{"title":"iGEM Registry: chassis organisms","url":"https://parts.igem.org/Main_Page"}]},"intro":{"treeId":"synthetic-biology","id":"intro","title":{"name":"welcome to the synbio skill tree","level":1},"project":"Orientation","video":{"url":""},"time":10,"level":"beginner","overview":{"description":"This tree turns the open-source NeoSynBio Graduate's Guide into a navigable, project-based curriculum. Each node pairs a hands-on protocol with the best-rated external guides so you can go from zero to expressing and purifying your own protein.","objectives":["understand the wet-lab progression from sterile workspace to protein purification","identify which nodes you can skip based on prior experience","set up a free DNA sequence editor (Benchling or SnapGene)","understand the legal/biosafety framing before doing any genetic modification"],"prerequisites":["an undergraduate background in biology is helpful but not required"]},"steps":{"description":"This tree turns the open-source NeoSynBio Graduate's Guide into a navigable, project-based curriculum. Each node pairs a hands-on protocol with the best-rated external guides so you can go from zero to expressing and purifying your own protein.","intro":"This tree turns the open-source NeoSynBio Graduate's Guide into a navigable, project-based curriculum. Each node pairs a hands-on protocol with the best-rated external guides so you can go from zero to expressing and purifying your own protein.","tools":["a computer","internet access","a notebook (paper or Benchling)"],"estimatatedTime":{"setup":2,"config":3,"testing":3},"instructions":[{"title":"Read the guide philosophy","description":"Skim the NeoSynBio introduction. The guide is comprehensive on purpose: skip anything you already know and dive deep where you have gaps."},{"title":"Pick your sequence editor","description":"Create a free Benchling account or download SnapGene Viewer. You'll use it constantly for plasmid maps, primer design and in-silico cloning."},{"title":"Note your local biosafety rules","description":"Identify your country's gene-technology regulator before any modification work. The well-trodden path (K12-derived E. coli) is the easiest to get approved."}]},"submission":{"description":"Write a one-paragraph learning plan: which nodes you'll skip, which you'll focus on, and what your target capstone protein is (GFP is a great first choice)."},"resources":[{"title":"NeoSynBio: The Graduate's Guide to Synthetic Biology","url":"https://www.neosynbio.com/the-graduates-guide-to-synthetic-biology"},{"title":"Addgene: Protocols hub & 'Intro to the Lab Bench' series","url":"https://www.addgene.org/protocols/"},{"title":"iGEM Registry of Standard Biological Parts","url":"https://parts.igem.org/Main_Page"},{"title":"Benchling (free academic molecular biology suite)","url":"https://www.benchling.com/"}]},"lab-automation":{"treeId":"synthetic-biology","id":"lab-automation","title":{"name":"laboratory automation","level":7},"project":"Lab Automation","video":{"url":"https://www.youtube.com/watch?v=Plh4KfAzTdc"},"time":150,"level":"advanced","overview":{"description":"Move from hand-pipetting to programmable liquid handlers (Opentrons, Hamilton) and robotic workflows. Automation buys reproducibility, throughput, and a traceable record - the reason modern labs and biofoundries scale a protocol from 8 to 800 samples without the error creeping in.","objectives":["write a liquid-handling protocol as code (e.g. Opentrons Python API)","define deck layout, labware, and liquid classes; calibrate offsets","judge what is worth automating vs doing by hand","design for traceability - every step logged and reproducible"],"prerequisites":["PCR","Micropipette"]},"steps":{"description":"Move from hand-pipetting to programmable liquid handlers (Opentrons, Hamilton) and robotic workflows. Automation buys reproducibility, throughput, and a traceable record - the reason modern labs and biofoundries scale a protocol from 8 to 800 samples without the error creeping in.","intro":"A robot only does exactly what you script - the skill is turning a bench protocol into deterministic, calibrated, error-checked code.","tools":["Opentrons OT-2/Flex (or Hamilton/Tecan)","Python protocol API","labware definitions","a scheduler for multi-step runs"],"estimatatedTime":{"setup":40,"config":80,"testing":40},"instructions":[{"title":"Model the protocol","description":"Break the manual protocol into discrete transfers; identify volumes, sources, destinations, and mixing."},{"title":"Write it as code","description":"Define labware and the deck map, then script the transfers with correct liquid classes (aspiration/dispense rates for viscous or volatile liquids)."},{"title":"Calibrate & dry-run","description":"Calibrate tip and labware offsets, then dry-run without liquid to catch collisions and mispicks before committing samples."},{"title":"Run, log, iterate","description":"Execute with run logs for traceability; review errors (tip pickup failures, evaporation) and tighten the protocol."}]},"submission":{"description":"Automate one real protocol (e.g. a serial dilution or PCR setup) as a calibrated, dry-run-tested script, and justify why it was worth automating."},"resources":[{"title":"HTGAA - Opentrons lab work (Week 3)","url":"https://2026a.htgaa.org/"},{"title":"Opentrons Python Protocol API docs","url":"https://docs.opentrons.com/v2/"},{"title":"PyLabRobot - hardware-agnostic lab automation","url":"https://docs.pylabrobot.org/"}]},"ligation":{"treeId":"synthetic-biology","id":"ligation","title":{"name":"ligation & troubleshooting","level":3},"project":"Cut & Paste Cloning","video":{"url":"https://www.neb.com/en-us/tools-and-resources/video-library/dna-ligation"},"time":90,"level":"intermediate","overview":{"description":"T4 DNA ligase glues DNA back together. Its buffer is the most thermosensitive reagent in the whole guide - 1-2 freeze/thaw cycles and it's done, so aliquot into 10 ul tubes. Controls aren't optional: they're your bumpers for debugging perishable reagents.","objectives":["set up a T4 DNA ligase reaction","protect thermosensitive ligase buffer with tiny aliquots","design the full panel of control plates"],"prerequisites":["digested backbone and insert","T4 DNA ligase","competent cells"]},"steps":{"description":"T4 DNA ligase glues DNA back together. Its buffer is the most thermosensitive reagent in the whole guide - 1-2 freeze/thaw cycles and it's done, so aliquot into 10 ul tubes. Controls aren't optional: they're your bumpers for debugging perishable reagents.","intro":"T4 DNA ligase glues DNA back together. Its buffer is the most thermosensitive reagent in the whole guide - 1-2 freeze/thaw cycles and it's done, so aliquot into 10 ul tubes. Controls aren't optional: they're your bumpers for debugging perishable reagents.","tools":["T4 DNA ligase","ligase buffer (aliquoted)","digested DNA","competent cells","control plates"],"estimatatedTime":{"setup":15,"config":30,"testing":30},"instructions":[{"title":"Aliquot the buffer","description":"Split ligase buffer into 10 ul single-use tubes; only thaw one at a time."},{"title":"Set up the reaction","description":"Combine vector, insert, ligase and ATP-containing buffer at the right molar ratio; add kinase if ends are dephosphorylated."},{"title":"Run the controls","description":"Set up negative (no plasmid), positive (uncut), digest-only, ligation, and optional dephosphorylation plates."},{"title":"Transform & interpret","description":"Transform the ligation mix and read each control plate to localise any failure."}]},"submission":{"description":"Submit your ligation plus a labelled photo of all control plates, with a one-line interpretation of each."},"resources":[{"title":"NeoSynBio: Ligation & Troubleshooting","url":"https://www.neosynbio.com/ligation-troubleshooting"},{"title":"NEB: DNA ligation with T4 DNA ligase (protocol)","url":"https://www.neb.com/en-us/protocols/0001/01/01/dna-ligation-with-t4-dna-ligase-m0202"},{"title":"Addgene: DNA ligation protocol","url":"https://www.addgene.org/protocols/dna-ligation/"},{"title":"Addgene: Plasmid screening strategies","url":"https://blog.addgene.org/plasmids-101-plasmid-screening-strategies"}]},"mammalian-cell-culture":{"treeId":"synthetic-biology","id":"mammalian-cell-culture","title":{"name":"mammalian cell culture","level":6},"project":"Cell Culture","video":{"url":"https://www.youtube.com/watch?v=CMRKKl9XSDU"},"time":150,"level":"advanced","overview":{"description":"Growing mammalian cells (HEK293, CHO) underpins therapeutics, antibody production, and cell-based assays. It is aseptic technique at a higher stakes level: slow-growing, contamination-prone cells in a CO2 incubator, passaged before they over-confluence.","objectives":["passage adherent/suspension cells at the right confluence","maintain sterility in a biosafety cabinet with slow-growing cells","understand CO2/bicarbonate media buffering and why phenol-red matters","detect and prevent contamination - including invisible mycoplasma"],"prerequisites":["Aseptic technique"]},"steps":{"description":"Growing mammalian cells (HEK293, CHO) underpins therapeutics, antibody production, and cell-based assays. It is aseptic technique at a higher stakes level: slow-growing, contamination-prone cells in a CO2 incubator, passaged before they over-confluence.","intro":"Mammalian culture is aseptic technique with no margin: a doubling time of a day means a single contamination event costs a week, so discipline in the hood is everything.","tools":["biosafety cabinet (laminar flow)","CO2 incubator","cell line + complete media","hemocytometer / cell counter","mycoplasma test"],"estimatatedTime":{"setup":40,"config":80,"testing":40},"instructions":[{"title":"Work in the hood","description":"Warm media, wipe everything with 70% ethanol, and keep a clean laminar-flow field; never breathe over open vessels."},{"title":"Monitor confluence","description":"Check under the microscope; passage before cells over-grow (contact inhibition/stress changes phenotype)."},{"title":"Passage","description":"Trypsinise (adherent) or split (suspension) to the right seeding density; count cells for reproducible splits."},{"title":"Guard against contamination","description":"Watch media colour (phenol-red pH), and test routinely for mycoplasma - it is invisible by eye but wrecks data."}]},"submission":{"description":"Outline a passaging routine for a cell line including confluence judgement, seeding density, and how you would monitor for contamination (bacterial, fungal, mycoplasma)."},"resources":[{"title":"Mammalian cell culture - basics (Thermo Fisher)","url":"https://www.thermofisher.com/us/en/home/references/gibco-cell-culture-basics.html"},{"title":"Mycoplasma contamination - why it matters","url":"https://www.atcc.org/resources/technical-documents/mycoplasma-contamination"}]},"media-plates":{"treeId":"synthetic-biology","id":"media-plates","title":{"name":"mixing media & pouring plates","level":1},"project":"Reagent Prep","video":{"url":"https://www.addgene.org/protocols/pouring-lb-agar-plates/"},"time":90,"level":"beginner","overview":{"description":"Mixing your own media is cheap and self-sufficient: protein, yeast extract, salt, water and agar. Antibiotic media is 'biotech on easy mode' - a few drops purge anything without your plasmid. The only catch is a little maths for antibiotic dilutions.","objectives":["mix LB liquid media and LB-agar from scratch","pour even, bubble-free agar plates","prepare antibiotic stock solutions and selection plates","use a micropipette accurately"],"prerequisites":["a sterile workspace","a media-sterilisation method"]},"steps":{"description":"Mixing your own media is cheap and self-sufficient: protein, yeast extract, salt, water and agar. Antibiotic media is 'biotech on easy mode' - a few drops purge anything without your plasmid. The only catch is a little maths for antibiotic dilutions.","intro":"Mixing your own media is cheap and self-sufficient: protein, yeast extract, salt, water and agar. Antibiotic media is 'biotech on easy mode' - a few drops purge anything without your plasmid. The only catch is a little maths for antibiotic dilutions.","tools":["LB components","agar","petri dishes","glassware","weighing scale","RO/MilliQ water","micropipette","antibiotic stocks"],"estimatatedTime":{"setup":15,"config":30,"testing":30},"instructions":[{"title":"Mix LB liquid media","description":"Combine tryptone, yeast extract and NaCl in water, then sterilise. This is your standard E. coli media."},{"title":"Make LB-agar","description":"Add agar to LB before sterilising. Cool to ~50C before pouring so it doesn't kill antibiotics."},{"title":"Add antibiotics","description":"Once the agar is hand-warm, add antibiotic from a frozen stock at the working concentration, swirl, and pour."},{"title":"Pour plates","description":"Pour a thin even layer, flame off bubbles, let set, then dry lid-ajar before storing inverted at 4C."}]},"submission":{"description":"Pour a set of LB-agar plates (plain and antibiotic). Photograph them and report your antibiotic working concentration and stock dilution maths."},"resources":[{"title":"NeoSynBio: Mixing Media & Pouring Plates","url":"https://www.neosynbio.com/mixing-media-and-pouring-plates"},{"title":"NeoSynBio: Antibiotic Stock Solutions & Dilutions","url":"https://www.neosynbio.com/antibiotic-stock-solution-mixing"},{"title":"Addgene: Making LB agar plates / Over-agar antibiotic","url":"https://www.addgene.org/protocols/pouring-lb-agar-plates/"},{"title":"Cold Spring Harbor Protocols: LB (Luria-Bertani) medium","url":"https://cshprotocols.cshlp.org/content/2006/1/pdb.rec8141"}]},"micropipette":{"treeId":"synthetic-biology","id":"micropipette","title":{"name":"the micropipette","level":1},"project":"Equipment","video":{"url":"https://www.youtube.com/watch?v=aSeod1Y5MRc"},"time":30,"level":"beginner","overview":{"description":"The micropipette is the most important tool in your arsenal. Accurate, confident pipetting underpins every protocol in this tree - get comfortable here and everything downstream gets easier.","objectives":["set volume correctly across P10/P100/P1000","use first vs second stop","avoid bubbles and ensure accuracy/precision"],"prerequisites":["a set of micropipettes and tips"]},"steps":{"description":"The micropipette is the most important tool in your arsenal. Accurate, confident pipetting underpins every protocol in this tree - get comfortable here and everything downstream gets easier.","intro":"The micropipette is the most important tool in your arsenal. Accurate, confident pipetting underpins every protocol in this tree - get comfortable here and everything downstream gets easier.","tools":["P10/P100/P1000 micropipettes","appropriate tips","practice tubes","coloured water"],"estimatatedTime":{"setup":5,"config":10,"testing":10},"instructions":[{"title":"Pick the right pipette","description":"Choose the pipette whose range brackets your target volume; never set beyond the marked range."},{"title":"Set the volume","description":"Dial to the target volume, reading the digits correctly for each pipette model."},{"title":"Aspirate & dispense","description":"Press to the first stop to draw up; use the second stop to fully expel. Pipette slowly to avoid bubbles."},{"title":"Verify accuracy","description":"Practise with coloured water and, if possible, check by weighing on a balance."}]},"submission":{"description":"Demonstrate accurate transfers across P10/P100/P1000 (a photo or short clip), and note any accuracy check you performed."},"resources":[{"title":"NeoSynBio: THE Micropipette equipment guide","url":"https://www.neosynbio.com/micropipette"},{"title":"Addgene: pipetting fundamentals (Intro to the Lab Bench)","url":"https://www.addgene.org/protocols/"},{"title":"Eppendorf: how to pipette correctly","url":"https://www.eppendorf.com/us-en/lab-academy/lab-practice/"}]},"miniprep":{"treeId":"synthetic-biology","id":"miniprep","title":{"name":"plasmid miniprep (ethanol lysis)","level":2},"project":"DNA Extraction","video":{"url":"https://www.youtube.com/watch?v=MxV6FXPn6VU"},"time":120,"level":"intermediate","overview":{"description":"The miniprep is the premier method for purifying plasmid DNA - doable in under two hours with the right set-up. It uses some nasty chemicals (guanidine), so read the MSDS. A high-speed centrifuge is the single most important piece of equipment here.","objectives":["perform a silica-column miniprep end to end","handle guanidine-based buffers safely","judge plasmid yield (gel is more reliable than nanodrop)"],"prerequisites":["a fresh pure colony","miniprep buffers","a high-speed centrifuge"]},"steps":{"description":"The miniprep is the premier method for purifying plasmid DNA - doable in under two hours with the right set-up. It uses some nasty chemicals (guanidine), so read the MSDS. A high-speed centrifuge is the single most important piece of equipment here.","intro":"The miniprep is the premier method for purifying plasmid DNA - doable in under two hours with the right set-up. It uses some nasty chemicals (guanidine), so read the MSDS. A high-speed centrifuge is the single most important piece of equipment here.","tools":["high-speed centrifuge","silica spin columns","miniprep buffers (resuspension, lysis, neutralisation, wash)","oven","nanodrop/Qubit (optional)"],"estimatatedTime":{"setup":20,"config":40,"testing":40},"instructions":[{"title":"Pellet & resuspend","description":"Spin down an overnight culture and resuspend the pellet in resuspension buffer."},{"title":"Lyse & neutralise","description":"Add lysis buffer, wait ~10 min so RNAse degrades RNA, then neutralise and spin to pellet debris."},{"title":"Bind to column","description":"Load the cleared supernatant onto a silica column and spin to capture plasmid DNA."},{"title":"Wash & dry","description":"Wash with chaotropic salt then ethanol; dry in an oven to evaporate residual ethanol."},{"title":"Elute","description":"Add elution buffer and spin into a fresh tube. Store at -20C."}]},"submission":{"description":"Miniprep a plasmid and report your yield. Verify quality by running an aliquot on an agarose gel."},"resources":[{"title":"NeoSynBio: Miniprep / Ethanol Lysis protocol","url":"https://www.neosynbio.com/purification-of-plasmid-dna-miniprep-aka-ethanol-lysis"},{"title":"Addgene: Purifying plasmid DNA (protocol & video)","url":"https://www.addgene.org/protocols/purify-plasmid-dna/"},{"title":"QIAGEN: QIAprep Spin Miniprep Kit handbook","url":"https://www.qiagen.com/us/products/discovery-and-translational-research/dna-rna-purification/dna-purification/plasmid-dna/qiaprep-spin-miniprep-kit"}]},"ml-for-biology":{"treeId":"synthetic-biology","id":"ml-for-biology","title":{"name":"ml / ai for biology","level":8},"project":"Bio AI / ML","video":{"url":"https://www.youtube.com/watch?v=hOtH5AAUWGA"},"time":150,"level":"advanced","overview":{"description":"Machine learning is now a core biotech tool: protein language models (ESM) embed sequences, structure predictors (AlphaFold) fold them, and generative models design new ones. The valuable skill is not running a model but evaluating it honestly - homology-aware splits, sensible baselines, and wet-lab validation.","objectives":["use foundation models (ESM embeddings, AlphaFold) as tools","avoid data leakage with homology-aware train/test splits","choose baselines and metrics that actually reflect the biology","treat model output as a hypothesis to validate experimentally, not a result"],"prerequisites":["Bioinformatics foundations","Computational protein design"]},"steps":{"description":"Machine learning is now a core biotech tool: protein language models (ESM) embed sequences, structure predictors (AlphaFold) fold them, and generative models design new ones. The valuable skill is not running a model but evaluating it honestly - homology-aware splits, sensible baselines, and wet-lab validation.","intro":"Bio ML rewards skepticism: a model that looks brilliant usually has a leaky split or a too-easy test set - the job is to break your own model before the wet lab does.","tools":["protein language models (ESM)","AlphaFold / structure tools","PyTorch / scikit-learn","sequence-identity clustering (MMseqs2/CD-HIT) for splits"],"estimatatedTime":{"setup":40,"config":80,"testing":40},"instructions":[{"title":"Frame the task","description":"Define input->output precisely (function prediction, binder design, property regression) and the biological question it answers."},{"title":"Split honestly","description":"Cluster by sequence/structure identity and split across clusters so the test set is not a near-duplicate of training (the #1 way bio ML lies)."},{"title":"Baseline & embed","description":"Compare against a simple baseline; use ESM embeddings or structures as features where they help."},{"title":"Validate wet-lab","description":"Treat top predictions as hypotheses - order and test them, and report real hit rate, not just held-out AUC."}]},"submission":{"description":"Propose an ML task for a biological problem, specify a leakage-proof (homology-aware) evaluation, and describe how you would validate predictions experimentally."},"resources":[{"title":"HTGAA - AI, SynBio & Scaling Health (Week 13)","url":"https://2026a.htgaa.org/"},{"title":"ESM - Evolutionary Scale Modeling (protein LMs)","url":"https://github.com/facebookresearch/esm"},{"title":"AlphaFold","url":"https://github.com/google-deepmind/alphafold"}]},"ngs-analysis":{"treeId":"synthetic-biology","id":"ngs-analysis","title":{"name":"ngs data analysis","level":7},"project":"Data & Informatics","video":{"url":"https://www.youtube.com/watch?v=fCd6B5HRaZ8"},"time":150,"level":"advanced","overview":{"description":"Next-generation sequencing turns biology into big data: read QC, alignment to a reference, variant calling, and RNA-seq quantification. Understanding coverage/depth, error modes, and pipelines (nf-core) is a core industry competency.","objectives":["explain read depth / coverage and why it matters","run a mapping + variant-calling or RNA-seq quantification pipeline","QC reads (adapters, duplicates, quality) before calling anything","interpret a VCF and distinguish real variants from artefacts"],"prerequisites":["Bioinformatics foundations"]},"steps":{"description":"Next-generation sequencing turns biology into big data: read QC, alignment to a reference, variant calling, and RNA-seq quantification. Understanding coverage/depth, error modes, and pipelines (nf-core) is a core industry competency.","intro":"NGS analysis is a pipeline discipline: garbage-in propagates, so QC and coverage decisions upstream determine whether a downstream call is trustworthy.","tools":["reference genome + aligner (BWA/Bowtie2/STAR)","variant caller (GATK/bcftools)","QC (FastQC/MultiQC)","workflow manager (Nextflow / nf-core)"],"estimatatedTime":{"setup":40,"config":80,"testing":40},"instructions":[{"title":"QC the reads","description":"Run FastQC/MultiQC; trim adapters and low-quality tails; check duplication and GC bias."},{"title":"Align","description":"Map to a reference (BWA/STAR); assess mapping rate and coverage uniformity."},{"title":"Call & filter","description":"Call variants or quantify expression; filter by depth/quality to remove artefacts."},{"title":"Reproduce","description":"Wrap it in a workflow (nf-core) so the whole pipeline reruns identically on new data."}]},"submission":{"description":"Describe how you would go from raw reads to a filtered variant call (or expression matrix), naming the QC and coverage checks that make the result trustworthy."},"resources":[{"title":"nf-core - community NGS pipelines","url":"https://nf-co.re/"},{"title":"GATK Best Practices","url":"https://gatk.broadinstitute.org/hc/en-us/sections/360007226651"}]},"pcr":{"treeId":"synthetic-biology","id":"pcr","title":{"name":"polymerase chain reaction (pcr)","level":4},"project":"Amplification","video":{"url":"https://www.youtube.com/watch?v=WfiBa2Exdr4"},"time":120,"level":"intermediate","overview":{"description":"PCR uses heating/cooling cycles to make a polymerase replicate the region between two primers, doubling product each cycle until millions of copies exist by ~25 cycles. Set up a master mix, distribute, add your variable, and let the machine work while you have a sandwich.","objectives":["explain denaturation, annealing and extension","assemble a master mix and distribute reactions","program thermocycler variables for your amplicon"],"prerequisites":["template DNA","primers","a thermocycler","polymerase + dNTPs"]},"steps":{"description":"PCR uses heating/cooling cycles to make a polymerase replicate the region between two primers, doubling product each cycle until millions of copies exist by ~25 cycles. Set up a master mix, distribute, add your variable, and let the machine work while you have a sandwich.","intro":"PCR uses heating/cooling cycles to make a polymerase replicate the region between two primers, doubling product each cycle until millions of copies exist by ~25 cycles. Set up a master mix, distribute, add your variable, and let the machine work while you have a sandwich.","tools":["thermocycler","DNA polymerase (Taq/Q5/Phusion)","dNTPs","primers","template","master mix tubes"],"estimatatedTime":{"setup":20,"config":40,"testing":40},"instructions":[{"title":"Build a master mix","description":"Combine water, buffer, dNTPs, polymerase and primers common to all reactions; add polymerase last on ice."},{"title":"Distribute & add template","description":"Split the mix into tubes and add each template/variable."},{"title":"Program the cycler","description":"Set initial denaturation, then 25-35 cycles of denature/anneal/extend, using the NEB Tm Calculator for annealing temperature."},{"title":"Check on a gel","description":"Run the product on an agarose gel to confirm a band of the expected size."}]},"submission":{"description":"Amplify a target region and submit a gel showing a clean single band at the expected size."},"resources":[{"title":"NeoSynBio: PCR protocol","url":"https://www.neosynbio.com/polymerase-chain-reaction"},{"title":"NEB: Polymerase Chain Reaction (PCR) overview","url":"https://www.neb.com/en-us/applications/dna-amplification-pcr-and-qpcr/polymerase-chain-reaction-pcr"},{"title":"NEB: Protocol for a routine PCR reaction","url":"https://www.neb.com/en/protocols/protocol-for-a-routine-pcr-reaction-e0553"},{"title":"NEB Tm Calculator (annealing temperature)","url":"https://tmcalculator.neb.com/"}]},"plasmid-insertion":{"treeId":"synthetic-biology","id":"plasmid-insertion","title":{"name":"plasmid insertion (transformation)","level":3},"project":"Genetic Modification","video":{"url":"https://www.youtube.com/watch?v=1PqWnu2uBrY"},"time":120,"level":"intermediate","overview":{"description":"Heat shock, electroporation, gene guns - 'Plasmid Insertion' buries the lead. For first-timers, chemically competent cells + heat shock need the least investment. NOTE: this may count as Genetic Modification in your jurisdiction - check local law first.","objectives":["perform heat-shock transformation of chemically competent cells","understand electroporation as a higher-efficiency alternative","recover and plate transformants on selection"],"prerequisites":["purified plasmid","competent cells","a legal/registered workspace if required"]},"steps":{"description":"Heat shock, electroporation, gene guns - 'Plasmid Insertion' buries the lead. For first-timers, chemically competent cells + heat shock need the least investment. NOTE: this may count as Genetic Modification in your jurisdiction - check local law first.","intro":"Heat shock, electroporation, gene guns - 'Plasmid Insertion' buries the lead. For first-timers, chemically competent cells + heat shock need the least investment. NOTE: this may count as Genetic Modification in your jurisdiction - check local law first.","tools":["chemically competent cells","heat block or water bath at 42C","ice","SOC/LB recovery media","selection plates"],"estimatatedTime":{"setup":20,"config":40,"testing":40},"instructions":[{"title":"Thaw on ice","description":"Thaw competent cells on ice and gently add your plasmid DNA. Never vortex competent cells."},{"title":"Heat shock","description":"Incubate on ice, pulse at 42C for the strain-specific time, then return to ice."},{"title":"Recover","description":"Add warm recovery media and shake at 37C for ~1 hour (skip for ampicillin selection)."},{"title":"Plate & incubate","description":"Spread onto antibiotic plates and incubate overnight. Include a no-DNA negative control."}]},"submission":{"description":"Transform a plasmid into your host, plate with controls, and report colony counts the next day."},"resources":[{"title":"NeoSynBio: Plasmid Insertion protocols","url":"https://www.neosynbio.com/plasmid-insertion"},{"title":"Addgene: Bacterial transformation (protocol & video)","url":"https://www.addgene.org/protocols/bacterial-transformation/"},{"title":"NEB: High-efficiency transformation protocol","url":"https://www.neb.com/en-us/protocols/2012/05/21/high-efficiency-transformation-protocol-c2987"},{"title":"NeoSynBio: Heat shock of chemically competent cells","url":"https://www.neosynbio.com/heat-shock-transformation-of-chemically-competent-cells"}]},"plasmids101":{"treeId":"synthetic-biology","id":"plasmids101","title":{"name":"plasmids101 (theory)","level":2},"project":"Theory","video":{"url":"https://www.youtube.com/watch?v=8mUwXXPKeuc"},"time":45,"level":"beginner","overview":{"description":"Plasmids are like plugins for a cell - files you attach to change its function. But as the saying goes, synbio is 'like writing code inside a burrito': thousands of intersecting messages mean a change can cascade unpredictably, even killing the cell while it makes your protein.","objectives":["describe plasmid elements (ORI, resistance, MCS, promoter)","understand copy number and selection","appreciate 'catastrophic success' and metabolic burden"],"prerequisites":["DNA101"]},"steps":{"description":"Plasmids are like plugins for a cell - files you attach to change its function. But as the saying goes, synbio is 'like writing code inside a burrito': thousands of intersecting messages mean a change can cascade unpredictably, even killing the cell while it makes your protein.","intro":"Plasmids are like plugins for a cell - files you attach to change its function. But as the saying goes, synbio is 'like writing code inside a burrito': thousands of intersecting messages mean a change can cascade unpredictably, even killing the cell while it makes your protein.","tools":["Benchling or SnapGene","Addgene plasmid files"],"estimatatedTime":{"setup":7,"config":15,"testing":15},"instructions":[{"title":"Learn the parts","description":"Study the ORI, antibiotic-resistance gene, multiple cloning site and promoter, and what each does."},{"title":"Understand copy number","description":"High-copy plasmids give more yield but more burden; pick based on your goal."},{"title":"Beware catastrophic success","description":"Recognise that over-expression can kill cells. Inducible systems mitigate this."}]},"submission":{"description":"Summarise the function of each major plasmid element in your own words and identify them on a real plasmid map."},"resources":[{"title":"NeoSynBio: Plasmids101","url":"https://www.neosynbio.com/plasmids101"},{"title":"Addgene: Plasmids 101 eBook (4th edition)","url":"https://blog.addgene.org/plasmids-101-ebook-4th-edition"},{"title":"Addgene: Plasmids 101 blog series","url":"https://blog.addgene.org/topic/plasmids-101"}]},"primer-design":{"treeId":"synthetic-biology","id":"primer-design","title":{"name":"primer design","level":4},"project":"Amplification","video":{"url":"https://www.youtube.com/watch?v=mcOwlFVEino"},"time":60,"level":"intermediate","overview":{"description":"Primers are short (~15-30 bp) sequences that kickstart PCR. The biggest challenge is designing them to prefer your template over each other - primer dimers can ruin a month. Aim for Tm 50-60C, GC 40-60%, and keep paired Tms within 5C.","objectives":["apply length, GC%, Tm and GC-clamp guidelines","avoid self-dimers and primer dimers","use Benchling/Primer3 and the NEB Tm Calculator"],"prerequisites":["PCR fundamentals","a sequence viewer"]},"steps":{"description":"Primers are short (~15-30 bp) sequences that kickstart PCR. The biggest challenge is designing them to prefer your template over each other - primer dimers can ruin a month. Aim for Tm 50-60C, GC 40-60%, and keep paired Tms within 5C.","intro":"Primers are short (~15-30 bp) sequences that kickstart PCR. The biggest challenge is designing them to prefer your template over each other - primer dimers can ruin a month. Aim for Tm 50-60C, GC 40-60%, and keep paired Tms within 5C.","tools":["Benchling primer wizard or Primer3","NEB Tm Calculator","NCBI BLAST"],"estimatatedTime":{"setup":10,"config":20,"testing":20},"instructions":[{"title":"Set parameters","description":"Target length ~18-25 nt, GC 40-60%, Tm 50-60C, with a 3' GC clamp where possible."},{"title":"Check for dimers","description":"Use a design wizard to flag self-dimers, hairpins and primer-primer complementarity."},{"title":"Validate specificity","description":"BLAST your primers against the genome to rule out off-target binding."},{"title":"Confirm Tm","description":"Calculate annealing temperature with the NEB Tm Calculator for your specific polymerase."}]},"submission":{"description":"Design a validated primer pair, report Tm/GC/length for each, and show the dimer/specificity checks."},"resources":[{"title":"NeoSynBio: Primer Design","url":"https://www.neosynbio.com/primer-design"},{"title":"Benchling: The basics of primer design for PCR","url":"https://www.benchling.com/the-basics-of-primer-design-for-pcr"},{"title":"NEB Tm Calculator","url":"https://tmcalculator.neb.com/"},{"title":"Primer3 / Primer3Plus","url":"https://primer3.org/"}]},"protein-design":{"treeId":"synthetic-biology","id":"protein-design","title":{"name":"computational protein design","level":7},"project":"Protein Engineering","video":{"url":""},"time":180,"level":"advanced","overview":{"description":"Design and optimise proteins in silico before you ever touch a bench. Structure predictors (AlphaFold2, ESMFold) fold a sequence; generative models (RFdiffusion) invent new backbones; inverse-folding models (ProteinMPNN) choose sequences that fold to a target shape. You filter computationally, then order genes and validate.","objectives":["predict a structure from sequence with AlphaFold2/ESMFold","generate a de novo backbone or binder with RFdiffusion","design sequences for a fold with ProteinMPNN (inverse folding)","rank designs in silico and plan experimental validation"],"prerequisites":["Proteins 101","Primer Design (to order/clone the gene)"]},"steps":{"description":"A design-build-test loop that starts on a GPU: specify the function, model or generate the structure, choose sequences, filter, then express and assay the winners.","intro":"Modern protein design front-loads the expensive wet-lab step with cheap in-silico screening: generate thousands of candidates, keep the few most likely to fold and function, and only build those.","tools":["AlphaFold2 / ColabFold or ESMFold","RFdiffusion (de novo backbones)","ProteinMPNN (inverse folding)","a gene-synthesis vendor + expression vector"],"estimatatedTime":{"setup":45,"config":90,"testing":45},"instructions":[{"title":"Define the target","description":"State the function: a binder to a target, an enzyme scaffold, a stabilised variant. Fix the constraints (interface, active site, size)."},{"title":"Model or generate","description":"Fold candidate sequences with AlphaFold2/ESMFold, or generate new backbones toward the target with RFdiffusion."},{"title":"Design sequences","description":"Run ProteinMPNN on the backbone to pick sequences likely to fold to it; re-predict to check self-consistency (design then fold then compare RMSD)."},{"title":"Filter & order","description":"Rank by pLDDT/ipTM, interface metrics, and self-consistency; order the top genes and clone into an expression vector."},{"title":"Build & test","description":"Express, purify (His-tag), and assay binding/activity/stability. Feed results back into the next design round."}]},"submission":{"description":"Design one protein (a binder, scaffold, or stabilised variant), show the in-silico evidence it should fold (structure prediction + self-consistency), and outline how you would express and test it."},"resources":[{"title":"HTGAA - Protein Design (Weeks 4-5)","url":"https://2026a.htgaa.org/"},{"title":"AlphaFold / ColabFold (structure prediction)","url":"https://github.com/sokrypton/ColabFold"},{"title":"RFdiffusion - de novo protein design (Baker Lab)","url":"https://github.com/RosettaCommons/RFdiffusion"},{"title":"ProteinMPNN - inverse folding","url":"https://github.com/dauparas/ProteinMPNN"}]},"protein-induction":{"treeId":"synthetic-biology","id":"protein-induction","title":{"name":"induction of protein expression","level":7},"project":"Protein Production","video":{"url":"https://www.youtube.com/watch?v=ePwVeXxU26w"},"time":120,"level":"intermediate","overview":{"description":"Inducible expression lets you switch protein production on during exponential growth, avoiding the burden of constitutive expression. For E. coli, time induction by OD600. After inducing, you can lower the temperature to slow folding for complex proteins.","objectives":["compare inducible vs constitutive expression","measure OD600 to time induction","tune temperature post-induction for correct folding"],"prerequisites":["an expression construct in a host","a spectrophotometer"]},"steps":{"description":"Inducible expression lets you switch protein production on during exponential growth, avoiding the burden of constitutive expression. For E. coli, time induction by OD600. After inducing, you can lower the temperature to slow folding for complex proteins.","intro":"Inducible expression lets you switch protein production on during exponential growth, avoiding the burden of constitutive expression. For E. coli, time induction by OD600. After inducing, you can lower the temperature to slow folding for complex proteins.","tools":["spectrophotometer + cuvettes","inducer (e.g. IPTG)","shaking incubator","baffled flasks"],"estimatatedTime":{"setup":20,"config":40,"testing":40},"instructions":[{"title":"Grow to phase","description":"Grow cells at 37C with shaking until OD600 reaches the target window for your system."},{"title":"Induce","description":"Add inducer (e.g. IPTG) to switch on expression."},{"title":"Tune temperature","description":"For disulphide-bonded/complex proteins, drop the temperature to slow folding and reduce misfolding."}]},"submission":{"description":"Produce a growth curve (OD600 vs time), mark your induction point, and note your post-induction conditions."},"resources":[{"title":"NeoSynBio: Induction of Protein Expression","url":"https://www.neosynbio.com/induction-of-protein-expression"},{"title":"Thermo Fisher: recombinant protein expression learning center","url":"https://www.thermofisher.com/us/en/home/life-science/protein-biology/protein-biology-learning-center.html"},{"title":"NEB: protein expression with T7 systems","url":"https://www.neb.com/en-us/applications/protein-expression-and-analysis"}]},"proteins101":{"treeId":"synthetic-biology","id":"proteins101","title":{"name":"proteins101 (theory)","level":7},"project":"Theory","video":{"url":""},"time":45,"level":"intermediate","overview":{"description":"Whether you've mastered DNA manipulation or just want to make GFP, a working knowledge of protein mechanics serves you well. This theory primer covers enough to produce, purify and observe proteins - read more widely for the deep end.","objectives":["describe protein structure levels and folding","connect sequence to expression and purification choices","understand disulphide bonds and misfolding risks"],"prerequisites":["a confirmed expression construct"]},"steps":{"description":"Whether you've mastered DNA manipulation or just want to make GFP, a working knowledge of protein mechanics serves you well. This theory primer covers enough to produce, purify and observe proteins - read more widely for the deep end.","intro":"Whether you've mastered DNA manipulation or just want to make GFP, a working knowledge of protein mechanics serves you well. This theory primer covers enough to produce, purify and observe proteins - read more widely for the deep end.","tools":["literature","structure viewers (e.g. PyMOL, AlphaFold DB)"],"estimatatedTime":{"setup":7,"config":15,"testing":15},"instructions":[{"title":"Review structure","description":"Refresh primary->quaternary structure and how folding determines function."},{"title":"Plan for folding","description":"Note where disulphide bonds or complex folds may require slower expression."},{"title":"Map to methods","description":"Connect your protein's properties to induction, lysis and purification choices."}]},"submission":{"description":"Summarise your target protein's key properties (size, tags, folding needs) and how they shape your downstream plan."},"resources":[{"title":"NeoSynBio: Proteins101 (Graduate's Guide)","url":"https://www.neosynbio.com/the-graduates-guide-to-synthetic-biology"},{"title":"Khan Academy: Macromolecules / proteins","url":"https://www.khanacademy.org/science/biology"},{"title":"RCSB PDB-101: protein structure education","url":"https://pdb101.rcsb.org/"},{"title":"EMBL-EBI: protein bioinformatics training","url":"https://www.ebi.ac.uk/training/"}]},"restriction-digest":{"treeId":"synthetic-biology","id":"restriction-digest","title":{"name":"restriction enzyme digest","level":3},"project":"Cut & Paste Cloning","video":{"url":"https://www.youtube.com/watch?v=qKvtxi_CegQ"},"time":120,"level":"intermediate","overview":{"description":"Restriction enzymes are being phased out by Gibson/Golden Gate, but they're an excellent way to learn. In your viewer, filter to unique cutters to avoid shredding your plasmid, find the MCS, and design a non-palindromic two-enzyme digest for directional cloning.","objectives":["select unique-cutter enzymes using a sequence viewer","design and simulate a clean directional ligation","set up a digest and keep enzymes cold at all times"],"prerequisites":["purified plasmid","an insert","restriction enzymes","a sequence viewer"]},"steps":{"description":"Restriction enzymes are being phased out by Gibson/Golden Gate, but they're an excellent way to learn. In your viewer, filter to unique cutters to avoid shredding your plasmid, find the MCS, and design a non-palindromic two-enzyme digest for directional cloning.","intro":"Restriction enzymes are being phased out by Gibson/Golden Gate, but they're an excellent way to learn. In your viewer, filter to unique cutters to avoid shredding your plasmid, find the MCS, and design a non-palindromic two-enzyme digest for directional cloning.","tools":["restriction enzymes (kept on ice)","digest buffer","sequence viewer","thermocycler/heat block"],"estimatatedTime":{"setup":20,"config":40,"testing":40},"instructions":[{"title":"Filter to unique cutters","description":"In SnapGene/Benchling, show only enzymes that cut once to find usable sites in the MCS."},{"title":"Pick two enzymes","description":"Choose two enzymes with compatible buffers and non-homologous ends to force correct orientation."},{"title":"Simulate the assembly","description":"Virtually digest and ligate to confirm a clean junction before touching the bench."},{"title":"Run the digest","description":"Combine DNA, enzymes and buffer; incubate at the enzyme's temperature; keep enzymes on ice whenever out of the freezer."}]},"submission":{"description":"Submit your in-silico cloning map plus a gel showing the digested backbone and insert at expected sizes."},"resources":[{"title":"NeoSynBio: Restriction Enzyme Digest protocol","url":"https://www.neosynbio.com/restriction-enzyme-digest-of-plasmid-and-insert-dna"},{"title":"NEB: Restriction enzyme digestion overview & double digest finder","url":"https://www.neb.com/en-us/tools-and-resources/usage-guidelines/double-digest-finder"},{"title":"Addgene: Plasmid screening by restriction digest","url":"https://blog.addgene.org/plasmids-101-plasmid-screening-strategies"},{"title":"SnapGene: simulating restriction cloning","url":"https://www.snapgene.com/guides"}]},"rna-purification":{"treeId":"synthetic-biology","id":"rna-purification","title":{"name":"rna purification","level":5},"project":"RNA Workflows","video":{"url":"https://www.jove.com/v/10104/rna-extraction-and-rt-pcr-analysis-of-environmental-microbes"},"time":120,"level":"intermediate","overview":{"description":"RNA work demands extra care: RNases are everywhere and degrade your sample fast. Extraction lyses cells under RNase-inhibiting conditions, then separates RNA from DNA, protein and lipids.","objectives":["maintain an RNase-free workspace","lyse and separate RNA from DNA/protein","assess RNA integrity"],"prerequisites":["nucleic-acid handling basics","an RNase-free setup"]},"steps":{"description":"RNA work demands extra care: RNases are everywhere and degrade your sample fast. Extraction lyses cells under RNase-inhibiting conditions, then separates RNA from DNA, protein and lipids.","intro":"RNA work demands extra care: RNases are everywhere and degrade your sample fast. Extraction lyses cells under RNase-inhibiting conditions, then separates RNA from DNA, protein and lipids.","tools":["RNase-free tubes/tips","lysis reagent (e.g. guanidinium/phenol or column kit)","DNase","cold block"],"estimatatedTime":{"setup":20,"config":40,"testing":40},"instructions":[{"title":"Go RNase-free","description":"Use RNase-free consumables, gloves and reagents; keep samples cold."},{"title":"Lyse under denaturing conditions","description":"Lyse cells in a chaotropic/denaturing buffer that inactivates RNases."},{"title":"Separate & DNase-treat","description":"Bind/precipitate RNA, wash, and DNase-treat to remove genomic DNA before downstream use."}]},"submission":{"description":"Extract RNA and assess its integrity (e.g. gel or A260/A280), reporting yield and purity."},"resources":[{"title":"Thermo Fisher: RNA extraction for real-time PCR","url":"https://www.thermofisher.com/us/en/home/life-science/dna-rna-purification-analysis/rna-extraction/rna-applications/rna-extraction-for-real-time-pcr.html"},{"title":"NEB: RNA reagents & handling","url":"https://www.neb.com/en-us/applications/rna-analysis"},{"title":"JoVE: RNA extraction & RT-PCR (video)","url":"https://www.jove.com/v/10104/rna-extraction-and-rt-pcr-analysis-of-environmental-microbes"}]},"rt-qpcr":{"treeId":"synthetic-biology","id":"rt-qpcr","title":{"name":"rt-qpcr","level":5},"project":"RNA Workflows","video":{"url":"https://www.jove.com/v/10104/rna-extraction-and-rt-pcr-analysis-of-environmental-microbes"},"time":150,"level":"advanced","overview":{"description":"RT-qPCR transforms RNA into cDNA via reverse transcriptase, then quantifies it in real time. It's the gold standard for measuring gene expression - but genomic-DNA contamination causes false positives, so clean RNA matters.","objectives":["reverse-transcribe RNA to cDNA","design qPCR assays and controls","interpret Ct values and quantification"],"prerequisites":["RNA Purification","PCR"]},"steps":{"description":"RT-qPCR transforms RNA into cDNA via reverse transcriptase, then quantifies it in real time. It's the gold standard for measuring gene expression - but genomic-DNA contamination causes false positives, so clean RNA matters.","intro":"RT-qPCR transforms RNA into cDNA via reverse transcriptase, then quantifies it in real time. It's the gold standard for measuring gene expression - but genomic-DNA contamination causes false positives, so clean RNA matters.","tools":["reverse transcriptase","qPCR master mix (dye or probe)","real-time thermocycler","qPCR primers"],"estimatatedTime":{"setup":25,"config":50,"testing":50},"instructions":[{"title":"Reverse transcribe","description":"Convert purified RNA to cDNA with reverse transcriptase."},{"title":"Set up qPCR","description":"Design specific primers (often spanning exon junctions); include no-RT and no-template controls."},{"title":"Quantify","description":"Run real-time PCR and interpret Ct values for relative or absolute quantification."}]},"submission":{"description":"Design an RT-qPCR assay (primers + controls) for a target transcript and outline how you'd interpret the Ct data."},"resources":[{"title":"Bio-Rad: Real-Time PCR (qPCR) applications guide","url":"https://www.bio-rad.com/en-us/applications-technologies/real-time-pcr-qpcr"},{"title":"Thermo Fisher: RT-qPCR basics","url":"https://www.thermofisher.com/us/en/home/life-science/pcr/real-time-pcr/real-time-pcr-learning-center.html"},{"title":"JoVE: RNA extraction & RT-PCR (video)","url":"https://www.jove.com/v/10104/rna-extraction-and-rt-pcr-analysis-of-environmental-microbes"}]},"sdm":{"treeId":"synthetic-biology","id":"sdm","title":{"name":"site-directed mutagenesis","level":6},"project":"Advanced Editing","video":{"url":"https://www.youtube.com/watch?v=7xFvaI7coyg"},"time":120,"level":"advanced","overview":{"description":"SDM makes an almost-perfect copy of your gene with a single intentional point mutation. Use a megaprimer assembled with a backbone, or a round-the-world SDM PCR to remake the backbone too. This is genetic modification - check local rules.","objectives":["design mutagenic primers carrying the desired change","choose megaprimer vs round-the-world strategies","screen for the intended mutation"],"prerequisites":["Primer Design","Gradient PCR"]},"steps":{"description":"SDM makes an almost-perfect copy of your gene with a single intentional point mutation. Use a megaprimer assembled with a backbone, or a round-the-world SDM PCR to remake the backbone too. This is genetic modification - check local rules.","intro":"SDM makes an almost-perfect copy of your gene with a single intentional point mutation. Use a megaprimer assembled with a backbone, or a round-the-world SDM PCR to remake the backbone too. This is genetic modification - check local rules.","tools":["mutagenic primers","high-fidelity polymerase","DpnI (to remove template)"],"estimatatedTime":{"setup":20,"config":40,"testing":40},"instructions":[{"title":"Design mutagenic primers","description":"Centre the mismatch within the primer with sufficient flanking complementarity."},{"title":"Amplify the mutant","description":"Run high-fidelity PCR; for round-the-world, amplify the whole plasmid."},{"title":"Remove template & screen","description":"DpnI-digest the methylated template, transform, and sequence to confirm the mutation."}]},"submission":{"description":"Introduce a defined point mutation and confirm it by sequencing the screened clone."},"resources":[{"title":"NeoSynBio: Site Directed Mutagenesis","url":"https://www.neosynbio.com/site-directed-mutagenesis"},{"title":"NEB: Q5 Site-Directed Mutagenesis Kit protocol","url":"https://www.neb.com/en-us/products/e0554-q5-site-directed-mutagenesis-kit"},{"title":"Addgene: site-directed mutagenesis overview","url":"https://blog.addgene.org/plasmids-101-mutagenesis"}]},"sds-page":{"treeId":"synthetic-biology","id":"sds-page","title":{"name":"sds-page","level":7},"project":"Proteome Analysis","video":{"url":"https://www.jove.com/v/30378/sodium-dodecyl-sulphate-polyacrylamide-gel-electrophoresis-for"},"time":150,"level":"advanced","overview":{"description":"SDS-PAGE separates proteins by size. Because proteins lack DNA's uniform charge, they're denatured and wrapped in negative SDS ions so migration depends on size alone. It's the smelliest, most technically demanding gel in the guide - master it and everyone will beg you to run theirs.","objectives":["cast/handle a polyacrylamide gel safely","denature samples and coat them in SDS for uniform charge","size proteins against a ladder and assess purity"],"prerequisites":["protein fractions","an SDS-PAGE rig"]},"steps":{"description":"SDS-PAGE separates proteins by size. Because proteins lack DNA's uniform charge, they're denatured and wrapped in negative SDS ions so migration depends on size alone. It's the smelliest, most technically demanding gel in the guide - master it and everyone will beg you to run theirs.","intro":"SDS-PAGE separates proteins by size. Because proteins lack DNA's uniform charge, they're denatured and wrapped in negative SDS ions so migration depends on size alone. It's the smelliest, most technically demanding gel in the guide - master it and everyone will beg you to run theirs.","tools":["polyacrylamide gel rig","SDS sample buffer + reducing agent (DTT)","protein ladder","Coomassie/GelCode stain"],"estimatatedTime":{"setup":25,"config":50,"testing":50},"instructions":[{"title":"Prep samples","description":"Mix fractions with SDS loading buffer and a reducing agent (DTT to avoid the b-mercaptoethanol smell); heat to denature."},{"title":"Cast or use a gel","description":"Use a pre-cast or hand-cast polyacrylamide gel of the right percentage for your protein size."},{"title":"Run & stain","description":"Load samples + ladder, run at constant voltage, then stain (e.g. Coomassie/GelCode) to visualise bands."},{"title":"Assess purity","description":"Compare your elution lane to load/wash lanes to judge purity and confirm the expected molecular weight."}]},"submission":{"description":"Submit a stained SDS-PAGE gel showing your purified protein at the expected size, alongside load/flow-through/wash lanes."},"resources":[{"title":"NeoSynBio: SDS-PAGE protocol","url":"https://www.neosynbio.com/sds-page"},{"title":"Bio-Rad: A guide to polyacrylamide gel electrophoresis and detection","url":"https://www.bio-rad.com/en-us/applications-technologies/protein-electrophoresis-methods"},{"title":"Thermo Fisher: overview of SDS-PAGE","url":"https://www.thermofisher.com/us/en/home/life-science/protein-biology/protein-biology-learning-center/protein-biology-resource-library/pierce-protein-methods/overview-electrophoresis.html"},{"title":"NeoSynBio: SDS-PAGE enclosure equipment","url":"https://www.neosynbio.com/sdspage-enclosure"}]},"sequencing":{"treeId":"synthetic-biology","id":"sequencing","title":{"name":"sequencing prep & interpretation","level":5},"project":"Screening","video":{"url":"https://www.youtube.com/watch?v=-T60I1MJVko"},"time":90,"level":"intermediate","overview":{"description":"Sequencing prices keep dropping (synbio's Carlson Curve). At under ~$0.10/bp you can treat sequencing as an alternative to screening everything yourself - though preliminary screening still saves money. Send only your best candidates with a good primer.","objectives":["prepare purified product + primer for Sanger sequencing","decide when sequencing beats gel screening on cost","interpret chromatograms / alignments"],"prerequisites":["a purified plasmid or PCR product","a sequencing primer"]},"steps":{"description":"Sequencing prices keep dropping (synbio's Carlson Curve). At under ~$0.10/bp you can treat sequencing as an alternative to screening everything yourself - though preliminary screening still saves money. Send only your best candidates with a good primer.","intro":"Sequencing prices keep dropping (synbio's Carlson Curve). At under ~$0.10/bp you can treat sequencing as an alternative to screening everything yourself - though preliminary screening still saves money. Send only your best candidates with a good primer.","tools":["purified DNA","sequencing primer","sequence-alignment software"],"estimatatedTime":{"setup":15,"config":30,"testing":30},"instructions":[{"title":"Purify & quantify","description":"Clean up your plasmid or PCR product and quantify it to the provider's spec."},{"title":"Send with a primer","description":"Pair the sample with an appropriate sequencing primer per the provider's instructions."},{"title":"Align & interpret","description":"Align the read to your designed sequence to confirm the edit and check for mutations."}]},"submission":{"description":"Submit an alignment of your sequencing read against your designed construct, highlighting that the edit is correct."},"resources":[{"title":"NeoSynBio: Preparation for External Sequencing","url":"https://www.neosynbio.com/external-sequencing-prep"},{"title":"Oxford Nanopore: protocols resource centre (in-house sequencing)","url":"https://nanoporetech.com/resource-centre/protocols"},{"title":"Addgene: analyze sequencing results (Sanger)","url":"https://blog.addgene.org/plasmids-101-plasmid-screening-strategies"}]},"spectrophotometer":{"treeId":"synthetic-biology","id":"spectrophotometer","title":{"name":"the spectrophotometer","level":2},"project":"Equipment","video":{"url":"https://www.youtube.com/watch?v=RZsyZ7CwNSM"},"time":20,"level":"beginner","overview":{"description":"The spectrophotometer measures optical density (OD600) - how much light your culture blocks as it grows. It's how you choose the right moment to induce protein expression. It's relatively easy to DIY.","objectives":["measure OD600 against a blank","relate OD to growth phase","consider DIY photometer options"],"prerequisites":["the micropipette node"]},"steps":{"description":"The spectrophotometer measures optical density (OD600) - how much light your culture blocks as it grows. It's how you choose the right moment to induce protein expression. It's relatively easy to DIY.","intro":"The spectrophotometer measures optical density (OD600) - how much light your culture blocks as it grows. It's how you choose the right moment to induce protein expression. It's relatively easy to DIY.","tools":["spectrophotometer","cuvettes","media blank"],"estimatatedTime":{"setup":3,"config":6,"testing":6},"instructions":[{"title":"Blank the instrument","description":"Zero the reading with a cuvette of sterile media."},{"title":"Measure OD600","description":"Read your culture at 600 nm; dilute if the reading exceeds the linear range."},{"title":"Map to growth","description":"Track OD600 over time to identify exponential phase for induction."}]},"submission":{"description":"Record a short OD600 time-course of a growing culture and identify the exponential phase."},"resources":[{"title":"NeoSynBio: Spectrophotometer & cuvettes guide","url":"https://www.neosynbio.com/spectrophotometer-cuvettes"},{"title":"OD600 and bacterial growth curves (overview)","url":"https://www.thermofisher.com/us/en/home/life-science/lab-equipment/spectrophotometers-refractometers-electrochemistry/uv-vis-spectrophotometers.html"}]},"sterile-technique":{"treeId":"synthetic-biology","id":"sterile-technique","title":{"name":"sterile (aseptic) technique","level":2},"project":"Core Skills","video":{"url":"https://www.jove.com/v/10040/aseptic-technique-in-environmental-science"},"time":60,"level":"beginner","overview":{"description":"Aseptic technique is easy to learn, impossible to master. Technical errors only matter if they introduce non-experimental variables. If you reliably grow contamination-free plates and verify results, the nuances of your set-up don't matter - results are what count.","objectives":["perform sterile transfers near a flame","use an inoculating loop/wand and a glass spreader","understand why controls catch non-experimental variables","diagnose contamination from plate morphology"],"prerequisites":["poured plates","a sterile workspace"]},"steps":{"description":"Aseptic technique is easy to learn, impossible to master. Technical errors only matter if they introduce non-experimental variables. If you reliably grow contamination-free plates and verify results, the nuances of your set-up don't matter - results are what count.","intro":"Aseptic technique is easy to learn, impossible to master. Technical errors only matter if they introduce non-experimental variables. If you reliably grow contamination-free plates and verify results, the nuances of your set-up don't matter - results are what count.","tools":["inoculating loop or wand","glass spreader","Bunsen burner","agar plates","liquid culture"],"estimatatedTime":{"setup":10,"config":20,"testing":20},"instructions":[{"title":"Flame your tools","description":"Flame the inoculating loop to red-hot, let it cool a moment, then pick a colony or dip into culture - always within the cone of protection."},{"title":"Streak for single colonies","description":"Streak in quadrants, flaming the loop between sectors, to isolate single colonies."},{"title":"Spread evenly","description":"Use a sterile glass spreader to distribute liquid culture across a plate for even lawn or countable colonies."},{"title":"Always run controls","description":"Include positive and negative controls so that contamination or reagent failure is immediately diagnosable."}]},"submission":{"description":"Streak a plate to obtain isolated single colonies and photograph the result. Include a contamination-free negative control plate."},"resources":[{"title":"NeoSynBio: Sterile Technique protocol","url":"https://www.neosynbio.com/sterile-technique"},{"title":"NeoSynBio: The Inoculating Loop / Wand","url":"https://www.neosynbio.com/inoculation-wand"},{"title":"Addgene: Streaking bacteria for single colonies (video protocol)","url":"https://www.addgene.org/protocols/streak-plate/"},{"title":"ASM / JoVE Science Education: Aseptic technique fundamentals","url":"https://www.jove.com/science-education"}]},"sterile-workspace":{"treeId":"synthetic-biology","id":"sterile-workspace","title":{"name":"the sterile workspace","level":1},"project":"Lab Setup","video":{"url":""},"time":30,"level":"beginner","overview":{"description":"Before any synbio, you need PPE and a sterile workspace. Ethanol kills surface bacteria whil
