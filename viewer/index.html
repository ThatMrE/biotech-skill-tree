FACS blur the line by enabling high-throughput screening at selection-like scale?"},{"id":"biomanufacturing-q1","nodeId":"biomanufacturing","topic":"Biomanufacturing","difficulty":"advanced","prompt":"Going from a shake flask to a large bioreactor, which factor most commonly becomes the scale-up bottleneck?","options":["The color of the vessel","Oxygen transfer and mixing - gradients in dissolved O2, pH, and nutrients appear at scale","The plasmid sequence","The antibiotic"],"answer":1,"explanation":"At scale, you cannot mix and aerate as efficiently; oxygen transfer (kLa) and mixing time create gradients the cells never saw in a flask. Managing DO, agitation, and feed is the core of scale-up engineering.","probe":"Why does simply increasing stirrer speed to add oxygen create its own problem (shear)?"},{"id":"biomanufacturing-q2","nodeId":"biomanufacturing","topic":"Biomanufacturing","difficulty":"core","prompt":"In a fed-batch process, how does it differ from a simple batch culture?","options":["Nothing","Nutrients are fed gradually during the run to control growth and avoid overflow metabolism, extending high productivity","It uses no cells","It runs colder"],"answer":1,"explanation":"Batch provides all nutrients up front; fed-batch feeds substrate gradually to keep cells in a productive state and avoid inhibitory byproducts (e.g. acetate/overflow metabolism), typically boosting titer. Continuous processes feed and harvest simultaneously.","probe":"What is 'overflow metabolism' and why does feeding slowly help avoid it?"},{"id":"doe-statistics-q1","nodeId":"doe-statistics","topic":"DoE & Rigor","difficulty":"core","prompt":"Why is Design of Experiments (DoE) usually better than changing one factor at a time (OFAT)?","options":["It uses fewer replicates","It varies factors together, so it finds interactions and the optimum with fewer total runs than OFAT","It avoids statistics","OFAT is actually better"],"answer":1,"explanation":"OFAT misses interactions (where the best level of A depends on B) and is inefficient. Factorial/response-surface DoE varies factors simultaneously, revealing interactions and locating optima with fewer experiments.","probe":"Give an example where two factors interact so strongly that OFAT would find the wrong optimum."},{"id":"doe-statistics-q2","nodeId":"doe-statistics","topic":"DoE & Rigor","difficulty":"advanced","prompt":"What distinguishes biological replicates from technical replicates, and why does it matter for your statistics?","options":["Nothing, they are interchangeable","Biological replicates are independent samples (capture real variability); technical replicates re-measure the same sample - only biological replicates support claims about the population","Technical replicates increase sample size for inference","Replicates are unnecessary"],"answer":1,"explanation":"Technical replicates measure instrument/handling noise on one sample; biological replicates are independent biological units and capture the variability you actually want to generalize over. Treating technical replicates as n inflates significance (pseudoreplication).","probe":"How does pseudoreplication lead to p-values that fail to reproduce?"},{"id":"biosafety-biosecurity-q1","nodeId":"biosafety-biosecurity","topic":"Biosafety & Biosecurity","difficulty":"core","prompt":"Biosafety Levels (BSL-1 to BSL-4) are assigned based primarily on:","options":["The size of the lab","The risk of the biological agent (pathogenicity, transmissibility, treatability) and the work being done","The budget","The number of staff"],"answer":1,"explanation":"BSL is set by agent risk and procedure: BSL-1 (non-pathogenic, e.g. lab E. coli), BSL-2 (moderate-risk), BSL-3 (serious/airborne, e.g. TB), BSL-4 (lethal, no treatment, e.g. Ebola). Each level adds containment, PPE, and practices.","probe":"What containment upgrades distinguish BSL-2 from BSL-3?"},{"id":"biosafety-biosecurity-q2","nodeId":"biosafety-biosecurity","topic":"Biosafety & Biosecurity","difficulty":"advanced","prompt":"What is the distinction between biosafety and biosecurity, and where does DNA-synthesis screening fit?","options":["They are the same thing","Biosafety prevents accidental harm; biosecurity prevents deliberate misuse - synthesis providers screening orders against pathogens/toxins is a biosecurity control","Biosecurity is only about lab coats","Screening is unrelated to either"],"answer":1,"explanation":"Biosafety = protecting people/environment from accidents (containment, PPE). Biosecurity = preventing malicious misuse or diversion. Gene-synthesis screening (IGSC members check orders against dangerous sequences) is a front-line biosecurity measure, alongside DURC oversight.","probe":"Why is dual-use research of concern (DURC) governance a professional obligation, not just a regulatory box?"},{"id":"intro-q1","nodeId":"intro","topic":"Lab Orientation","difficulty":"foundational","prompt":"Before doing any genetic-modification work described in this curriculum, the non-negotiable first step is:","options":["Order reagents immediately","Confirm you are working in a legal, registered/approved space with appropriate oversight and documentation","Post the protocol publicly","Skip records to save time"],"answer":1,"explanation":"Much of this work constitutes genetic modification and is regulated in most jurisdictions. Working in an approved space (institutional/registered community lab) with the right oversight and a documented record is the baseline professional and legal requirement - everything else follows from it.","probe":"Who would you approach for approval of a recombinant DNA experiment at an institution?"},{"id":"host-selection-q1","nodeId":"host-selection","topic":"Host Selection","difficulty":"core","prompt":"Why is a laboratory K-12 derivative of E. coli the default chassis for beginner synthetic biology?","options":["It grows the slowest","It is non-pathogenic (BSL-1), extremely well-characterised, fast-growing, and genetically tractable","It is the only bacterium that takes plasmids","It requires no containment rules at all"],"answer":1,"explanation":"K-12 lab strains are disabled, non-pathogenic, and enormously well-characterised, with mature tools (plasmids, markers, protocols). That makes results interpretable and the work BSL-1. It still requires proper practice and oversight - 'safe strain' is not 'no rules'.","probe":"What would push you to choose a different chassis, such as yeast or Bacillus?"},{"id":"buffer-mixing-q1","nodeId":"buffer-mixing","topic":"Buffers & Reagents","difficulty":"core","prompt":"You need 50 mL of 1x TAE from a 50x stock. How much stock do you use, and why does buffer choice matter in a gel?","options":["50 mL stock; buffer is irrelevant","1 mL stock + 49 mL water; the buffer carries current and maintains pH so DNA charge/migration stays consistent","25 mL stock; it makes the gel set","5 mL stock; it stains the DNA"],"answer":1,"explanation":"C1V1 = C2V2: 50x to 1x is a 50-fold dilution, so 50 mL / 50 = 1 mL stock topped to 50 mL. The buffer conducts current and holds pH constant - without it DNA charge and migration drift and the gel runs poorly (or overheats).","probe":"What happens to a gel run if you use water instead of running buffer in the tank?"},{"id":"gblock-design-q1","nodeId":"gblock-design","topic":"Synthetic DNA Design","difficulty":"advanced","prompt":"When designing a synthetic gene fragment (gBlock) for expression in E. coli, which design consideration matters most?","options":["Making it as GC-rich as possible","Codon optimisation for the host plus avoiding extreme GC, long repeats, and strong secondary structure that break synthesis","Adding as many restriction sites as possible","Keeping it under 20 bp"],"answer":1,"explanation":"Synthesis vendors fail on repeats, homopolymers, hairpins, and extreme GC; expression suffers from rare codons in the host. So you codon-optimise for the chassis and smooth out the sequence complexity - while also adding the overhangs/sites your assembly method needs.","probe":"Why can codon optimisation occasionally hurt, e.g. for co-translational folding?"},{"id":"gradient-pcr-q1","nodeId":"gradient-pcr","topic":"Gradient PCR","difficulty":"core","prompt":"What is the purpose of running a gradient PCR?","options":["To test many templates at once","To test a range of annealing temperatures in one run and empirically find the one giving specific, strong product","To increase the extension time","To replace the need for primers"],"answer":1,"explanation":"A gradient block applies different annealing temperatures across the rows in a single run, so you can identify the optimum empirically rather than guessing from calculated Tm - the fastest way to fix weak or nonspecific amplification.","probe":"Once you find the optimum on a gradient, what do you check on the gel to pick the winning temperature?"},{"id":"flanking-addition-q1","nodeId":"flanking-addition","topic":"Flanking Sequence Addition","difficulty":"advanced","prompt":"You add restriction sites/assembly overhangs as 5' tails on your PCR primers. Why does the 3' end of the primer have to stay perfectly complementary to the template?","options":["It does not matter","Polymerase extends from the 3' end - a mismatched 3' end will not prime, while the unmatched 5' tail is simply incorporated into the product","The 3' end binds the enzyme","The 5' tail must match the template instead"],"answer":1,"explanation":"Extension initiates at the 3'-OH, so 3' complementarity is essential for priming. The 5' tail need not match: in cycle 1 it hangs off, and from cycle 2 onward it is copied into the amplicon - which is exactly how you append sites, overhangs, or tags.","probe":"After how many cycles is the added flanking sequence present on both ends of the product?"},{"id":"sdm-q1","nodeId":"sdm","topic":"Site-Directed Mutagenesis","difficulty":"advanced","prompt":"After a whole-plasmid site-directed mutagenesis PCR, you digest with DpnI before transforming. What does DpnI do?","options":["Cuts the new mutant plasmid","Cuts Dam-METHYLATED DNA - destroying the original template from E. coli while sparing the unmethylated PCR product","Ligates the ends","Removes the primers"],"answer":1,"explanation":"DpnI cleaves methylated GATC. The parental plasmid, prepped from a Dam+ E. coli strain, is methylated and gets destroyed; the newly synthesised (in vitro, unmethylated) mutant product survives. Skipping DpnI leaves a huge background of wild-type template.","probe":"What would your screening results look like if you forgot the DpnI step?"},{"id":"proteins101-q1","nodeId":"proteins101","topic":"Proteins 101","difficulty":"foundational","prompt":"Which statement about protein structure is correct?","options":["Primary structure is the 3D fold","Primary structure is the amino-acid sequence; secondary is local motifs (alpha-helix/beta-sheet); tertiary is the 3D fold; quaternary is multi-subunit assembly","Quaternary structure applies to every protein","Secondary structure means the gene sequence"],"answer":1,"explanation":"Sequence (primary) determines local hydrogen-bonded motifs (secondary), which pack into the 3D fold (tertiary); quaternary applies only to proteins with multiple subunits. This hierarchy is why a single point mutation can cascade into a misfolded, non-functional protein.","probe":"Roughly how do you estimate a protein's molecular weight from its number of residues?"},{"id":"final-project-q1","nodeId":"final-project","topic":"Integrated Project","difficulty":"core","prompt":"You express and purify a protein end-to-end. Which set of checkpoints best proves the workflow actually worked?","options":["Only the final gel","Sequence-verified construct, induced vs uninduced SDS-PAGE, soluble vs insoluble fractions, and purity of the final elution","Colony count alone","The OD600 reading only"],"answer":1,"explanation":"Each stage needs its own evidence: sequencing proves the construct, the +/- induction gel proves expression, the soluble/insoluble split proves it did not go to inclusion bodies, and the final gel proves purity. A single end-point gel cannot tell you where a failure occurred.","probe":"If the final elution is empty, how do these checkpoints let you localise the failure?"},{"id":"advanced-omics-q1","nodeId":"advanced-omics","topic":"Omics","difficulty":"advanced","prompt":"Transcriptomics (RNA-seq) measures mRNA abundance. Why can it be a poor proxy for protein levels?","options":["mRNA and protein are always proportional","Post-transcriptional regulation, translation efficiency, and differing mRNA/protein stability decouple transcript abundance from protein abundance","RNA-seq measures protein directly","Proteins are not encoded by mRNA"],"answer":1,"explanation":"mRNA-protein correlation is often modest: translation rate, protein turnover, and post-transcriptional/post-translational regulation all intervene. That is exactly why proteomics exists as a separate measurement layer rather than being inferred from RNA-seq.","probe":"When would you invest in proteomics rather than relying on transcriptomics?"},{"id":"eln-lims-q1","nodeId":"eln-lims","topic":"ELN / LIMS & Data Hygiene","difficulty":"core","prompt":"What is the practical test of whether your electronic lab record is good enough?","options":["It is long","Another competent scientist could reproduce the experiment from your record alone - materials, conditions, and metadata all linked and versioned","Only you can understand it","It is stored on your laptop desktop"],"answer":1,"explanation":"Records exist to make work reproducible and auditable. FAIR practice - linked materials with unique IDs, captured conditions/metadata, and versioned (never overwritten) entries - is what lets a colleague, an auditor, or future-you rerun the work.","probe":"Why is versioning a plasmid map preferable to overwriting the file?"}],"htgaa":{"course":"HTGAA — How To Grow (Almost) Anything · MIT Media Lab","term":"Spring 2026","link":"https://2026a.htgaa.org/","note":"Course-companion mapping: which HTGAA week a skill-tree technique is taught in. Weeks, dates, and instructors are from the published Spring 2026 schedule.","map":{"intro":{"w":"1","date":"Feb 3","module":"Principles & Practices","who":["David Kong","George Church","Joe Jacobson"]},"sterile-workspace":{"w":"1","date":"Feb 3","module":"Principles & Practices","who":["David Kong","George Church","Joe Jacobson"]},"micropipette":{"w":"3","date":"Feb 17","module":"Opentrons lab work (liquid handling / automation)","who":[]},"dna101":{"w":"2","date":"Feb 10","module":"DNA — Read, Write & Edit","who":["George Church","Joe Jacobson","Emily Leproust"]},"gblock-design":{"w":"2","date":"Feb 10","module":"DNA — Read, Write & Edit","who":["George Church","Joe Jacobson","Emily Leproust"]},"sequencing":{"w":"2","date":"Feb 10","module":"DNA — Read, Write & Edit","who":["George Church","Joe Jacobson","Emily Leproust"]},"crispr":{"w":"2","date":"Feb 10","module":"DNA — Read, Write & Edit","who":["George Church","Joe Jacobson","Emily Leproust"]},"sdm":{"w":"2","date":"Feb 10","module":"DNA — Read, Write & Edit","who":["George Church","Joe Jacobson","Emily Leproust"]},"proteins101":{"w":"4","date":"Feb 24","module":"Protein Design I","who":["Thras Karydis","Jon Kaufman"]},"protein-design":{"w":"4–5","date":"Feb 24 / Mar 3","module":"Protein Design I & II","who":["Thras Karydis","Jon Kaufman","Pranam Chatterjee","Gabriele Corso"]},"gibson":{"w":"6","date":"Mar 10","module":"Genetic Circuits I: Assembly Technologies","who":["Doug Densmore","Traci Haddock"]},"golden-gate":{"w":"6","date":"Mar 10","module":"Genetic Circuits I: Assembly Technologies","who":["Doug Densmore","Traci Haddock"]},"genetic-circuits":{"w":"6–7","date":"Mar 10 / Mar 17","module":"Genetic Circuits I & II","who":["Doug Densmore","Traci Haddock","Ron Weiss","Evan Holbrook"]},"cell-free":{"w":"9","date":"Mar 31","module":"Cell-Free Systems","who":["Kate Adamala","Peter Nguyen","Ally Huang"]},"gel-imaging":{"w":"10","date":"Apr 7","module":"Advanced Imaging & Measurement Tech","who":["Evan Daugharthy"]},"spectrophotometer":{"w":"10","date":"Apr 7","module":"Advanced Imaging & Measurement Tech","who":["Evan Daugharthy"]},"advanced-omics":{"w":"10","date":"Apr 7","module":"Advanced Imaging & Measurement Tech","who":["Evan Daugharthy"]},"building-genomes":{"w":"12","date":"Apr 21","module":"Building Genomes","who":["George Church","John Glass","Jef Boeke"]},"final-project":{"w":"14","date":"May 5","module":"Bio Design & Bio Fabrication","who":["Michael Chen","Christina Agapakis"]},"biofabrication":{"w":"14","date":"May 5","module":"Bio Design & Bio Fabrication","who":["Michael Chen","Christina Agapakis"]},"lab-automation":{"w":"3","date":"Feb 17","module":"Opentrons lab work (liquid handling / automation)","who":[]},"ml-for-biology":{"w":"13","date":"Apr 28","module":"AI, SynBio, and Scaling Health Innovation","who":["Renee Wegrzyn"]},"bioinformatics":{"w":"2","date":"Feb 10","module":"DNA - Read, Write & Edit","who":["George Church","Joe Jacobson","Emily Leproust"]},"ngs-analysis":{"w":"2","date":"Feb 10","module":"DNA - Read, Write & Edit","who":["George Church","Joe Jacobson","Emily Leproust"]},"biosafety-biosecurity":{"w":"1","date":"Feb 3","module":"Principles & Practices","who":["David Kong","George Church","Joe Jacobson"]},"eln-lims":{"w":"3","date":"Feb 17","module":"Opentrons lab work (lab practices & records)","who":[]}}}}</script>
<script>
(function(){
  "use strict";
  var DATA = JSON.parse(document.getElementById('data').textContent);
  var TREE = DATA.tree, DETAILS = DATA.details;
  var QUESTIONS = DATA.questions || [];
  var HTGAA = DATA.htgaa || {};
  var HMAP = HTGAA.map || {};
  var NODES = TREE.nodes;
  var MAIN = new Set(TREE.mainPathNodes||[]);
  var byId = {}; NODES.forEach(function(n){byId[n.id]=n;});

  // equipment nodes: optional reference cards (depend only on intro, gate nothing)
  var gatesSomething = {};
  NODES.forEach(function(n){(n.dependencies||[]).forEach(function(d){gatesSomething[d]=true;});});
  function isEquip(n){
    var det = DETAILS[n.id]||{};
    var proj = (det.project||'').toLowerCase();
    return proj.indexOf('equip')>=0;
  }

  // ---- progress (localStorage) ----
  var KEY='synbio-progress-v1';
  var done = {};
  try{done = JSON.parse(localStorage.getItem(KEY)||'{}')||{};}catch(e){done={};}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(done));}catch(e){}}
  function isDone(id){return !!done[id];}
  function prereqsMet(id){
    var n=byId[id]; if(!n)return true;
    return (n.dependencies||[]).every(isDone);
  }
  // NOTHING IS EVER LOCKED. Every node is open, openable, and completable in any
  // order. Dependencies are shown as suggested trajectory, never as a gate --
  // 'next' merely flags the natural next step along the path.
  function status(id){return isDone(id)?'done':prereqsMet(id)?'next':'open';}
  // reverse index: what each node leads to (for trajectory navigation)
  var childrenOf={};
  NODES.forEach(function(n){
    (n.dependencies||[]).forEach(function(d){(childrenOf[d]=childrenOf[d]||[]).push(n.id);});
  });

  // ---- layout from initialPosition ----
  var xs=NODES.map(function(n){return n.initialPosition[0];});
  var ys=NODES.map(function(n){return n.initialPosition[1];});
  var minX=Math.min.apply(0,xs),maxX=Math.max.apply(0,xs);
  var minY=Math.min.apply(0,ys),maxY=Math.max.apply(0,ys);
  var SX=175, SY=125, PAD=120;
  function px(n){return (n.initialPosition[0]-minX)*SX+PAD;}
  function py(n){return (n.initialPosition[1]-minY)*SY+PAD;}
  var worldW=(maxX-minX)*SX+PAD*2;
  var worldH=(maxY-minY)*SY+PAD*2;

  var canvas=document.getElementById('canvas');
  var edges=document.getElementById('edges');
  var mapEl=document.getElementById('map');

  // ---- render map ----
  var nodeEls={};
  function glyphs(n){
    var g='';
    if(MAIN.has(n.id))g+='★';
    if(isEquip(n))g+='⚙';
    var det=DETAILS[n.id]||{};
    if(det.video&&det.video.url)g+='▶';
    if(HMAP[n.id])g+='⬢';
    return g;
  }
  function buildMap(){
    canvas.style.width=worldW+'px'; canvas.style.height=worldH+'px';
    edges.setAttribute('width',worldW); edges.setAttribute('height',worldH);
    // edges
    var ep='';
    NODES.forEach(function(n){
      (n.dependencies||[]).forEach(function(d){
        var p=byId[d]; if(!p)return;
        var x1=px(p),y1=py(p),x2=px(n),y2=py(n);
        var my=(y1+y2)/2;
        var hot=MAIN.has(n.id)&&MAIN.has(d);
        var equip=isEquip(n)||isEquip(p);
        ep+='<path d="M'+x1+','+y1+' C'+x1+','+my+' '+x2+','+my+' '+x2+','+y2+'" '
          +'fill="none" stroke="'+(hot?'var(--edge-hot)':'var(--edge)')+'" '
          +'stroke-width="'+(hot?2:1.3)+'" '+(equip?'stroke-dasharray="5 4" stroke="var(--orange)" opacity=".55"':'')+'/>';
      });
    });
    edges.innerHTML=ep;
    // nodes
    NODES.forEach(function(n){
      var el=document.createElement('div');
      el.className='node';
      el.style.left=px(n)+'px'; el.style.top=py(n)+'px';
      var det=DETAILS[n.id]||{};
      var proj=(det.project||'');
      el.innerHTML='<div class="nt">'+esc(n.title)+'</div>'
        +'<div class="nm"><span class="glyphs">'+glyphs(n)+'</span>'+(proj?'<span>'+esc(proj)+'</span>':'')+'</div>';
      el.addEventListener('click',function(ev){ev.stopPropagation();openPop(n.id);});
      canvas.appendChild(el);
      nodeEls[n.id]=el;
    });
    // tier labels down the left gutter, grouped by rounded y
    var tiers={};

  // ---- pan / zoom ----
  var tx=0,ty=0,scale=1;
  function applyTransform(){canvas.style.transform='translate('+tx+'px,'+ty+'px) scale('+scale+')';
    edges.style.transform=canvas.style.transform;}
  function clampScale(s){return Math.max(.25,Math.min(2.2,s));}
  function zoomAt(cx,cy,factor){
    var ns=clampScale(scale*factor);
    var k=ns/scale;
    tx=cx-(cx-tx)*k; ty=cy-(cy-ty)*k; scale=ns; applyTransform();
  }
  mapEl.addEventListener('wheel',function(e){e.preventDefault();
    var r=mapEl.getBoundingClientRect();
    zoomAt(e.clientX-r.left,e.clientY-r.top,e.deltaY<0?1.12:1/1.12);
  },{passive:false});
  // pointer drag + pinch
  var ptrs={},last=null,pinchD=0;
  mapEl.addEventListener('pointerdown',function(e){
    mapEl.setPointerCapture(e.pointerId);
    ptrs[e.pointerId]={x:e.clientX,y:e.clientY};
    if(Object.keys(ptrs).length===1){last={x:e.clientX,y:e.clientY};mapEl.classList.add('drag');}
  });
  mapEl.addEventListener('pointermove',function(e){
    if(!ptrs[e.pointerId])return;
    ptrs[e.pointerId]={x:e.clientX,y:e.clientY};
    var ids=Object.keys(ptrs);
    if(ids.length>=2){
      var a=ptrs[ids[0]],b=ptrs[ids[1]];
      var d=Math.hypot(a.x-b.x,a.y-b.y);
      var r=mapEl.getBoundingClientRect();
      var midx=(a.x+b.x)/2-r.left,midy=(a.y+b.y)/2-r.top;
      if(pinchD)zoomAt(midx,midy,d/pinchD);
      pinchD=d; last=null;
    }else if(last){
      tx+=e.clientX-last.x; ty+=e.clientY-last.y; last={x:e.clientX,y:e.clientY}; applyTransform();
    }
  });
  function endPtr(e){delete ptrs[e.pointerId];if(Object.keys(ptrs).length<2)pinchD=0;
    if(Object.keys(ptrs).length===0){last=null;mapEl.classList.remove('drag');}}
  mapEl.addEventListener('pointerup',endPtr);
  mapEl.addEventListener('pointercancel',endPtr);

  function fitTo(nodes){
    nodes=(nodes&&nodes.length)?nodes:NODES;
    var r=mapEl.getBoundingClientRect();
    var xmin=Math.min.apply(0,nodes.map(px))-90, xmax=Math.max.apply(0,nodes.map(px))+90;
    var ymin=Math.min.apply(0,nodes.map(py))-70, ymax=Math.max.apply(0,nodes.map(py))+70;
    var w=xmax-xmin,h=ymax-ymin;
    scale=clampScale(Math.min(r.width/w,r.height/h));
    tx=(r.width-w*scale)/2-xmin*scale;
    ty=(r.height-h*scale)/2-ymin*scale;
    applyTransform();
  }
  // Default/reset view: readable zoom, fit to WIDTH, anchored near the top so the

  function readableView(nodes){

    var w=xmax-xmin;
    scale=clampScale(Math.min(r.width/w, 1.05));

    ty=40-ymin*scale;
    applyTransform();
  }

  function shuffle(a,seed){ // deterministic-ish shuffle using an index seed (no Math.random)
    a=a.slice();
    for(var i=a.length-1;i>0;i--){seed=(seed*1103515245+12345)&0x7fffffff;var j=seed%(i+1);var t=a[i];a[i]=a[j];a[j]=t;}

  // ---- quiz engine ----
  var quiz=null;
  function ivStartQuiz(){
    var pool=poolFor(ivCfg.diff);

    var n=ivCfg.len==='all'?pool.length:Math.min(ivCfg.len,pool.length);

  function ivRenderQ(){
    var q=quiz.items[quiz.i];

    var html='<div class="iv-wrap">';
    html+='<div class="qbar"><span class="cnt">Q '+(quiz.i+1)+'/'+quiz.items.length+'</span>'
      +'<div class="prog"><i style="width:'+(quiz.i/quiz.items.length*100)+'%"></i></div>'
      +'<span class="sc">'+quiz.score+' correct</span></div>';
    html+='<div class="qmeta">'+diffBadge(q.difficulty)+'<span class="badge">'+esc(q.topic)+'</span></div>';
    html+='<p class="qprompt">'+esc(q.prompt)+'</p>';

    optOrder.forEach(function(oi,pos){

  function ivAnswer(chosen){
    var q=quiz.items[quiz.i];
    var correct=chosen===q.answer;
    if(correct)quiz.score++;
    quiz.answered.push({q:q,chosen:chosen,correct:correct});
    ivEl.querySelectorAll('.opt').forEach(function(b){
      var oi=parseInt(b.getAttribute('data-oi'),10);b.disabled=true;
      if(oi===q.answer)b.classList.add('correct');
      else if(oi===chosen)b.classList.add('wrong');
    });
    var det=DETAILS[q.nodeId]||{}, nodeTitle=(det.title&&det.title.name)||(byId[q.nodeId]&&byId[q.nodeId].title)||q.nodeId;
    var fb='<div class="expl"><b>'+(correct?'✓ correct':'✗ not quite')+'</b><p>'+esc(q.explanation)+'</p>';
    if(q.probe)fb+='<p class="probe">Interviewer would probe: '+esc(q.probe)+'</p>';
    fb+='<a href="#" data-study="'+esc(q.nodeId)+'">▸ study "'+esc(nodeTitle)+'" in the tree</a></div>';
    var last=quiz.i>=quiz.items.length-1;
    fb+='<button class="qnext" id="ivNext">'+(last?'see results →':'next question →')+'</button>';

      if(last){ivResults();}else{quiz.i++;ivRenderQ();}
    });

  }
  function ivResults(){
    var total=quiz.items.length, pct=Math.round(quiz.score/total*100);
    // breakdown by topic
    var byTopic={};
    quiz.answered.forEach(function(a){var t=a.q.topic;(byTopic[t]=byTopic[t]||{n:0,ok:0});byTopic[t].n++;if(a.correct)byTopic[t].ok++;});
    var verdict=pct>=85?'Interview-ready on these fundamentals.':pct>=65?'Solid — a few gaps to close before a screen.':'Keep drilling; review the misses below and their tree nodes.';
    var html='<div class="iv-wrap">';
    html+='<div class="iv-card" style="text-align:center"><div class="score-big">'+pct+'%</div>'
      +'<div class="score-lbl">'+quiz.score+' / '+total+' correct · '+esc(verdict)+'</div></div>';
    // topic breakdown
    html+='<div class="iv-card"><h3>by topic</h3><div class="brk">';
    Object.keys(byTopic).sort().forEach(function(t){
      var b=byTopic[t], p=Math.round(b.ok/b.n*100);
      html+='<div class="brk-row"><span class="nm">'+esc(t)+'</span><span class="bar2"><i style="width:'+p+'%"></i></span><span class="v">'+b.ok+'/'+b.n+'</span></div>';
    });
    html+='</div></div>';
    // misses
    var misses=quiz.answered.filter(function(a){return !a.correct;});
    if(misses.length){
      html+='<div class="iv-card"><h3>review your misses ('+misses.length+')</h3>';
      misses.forEach(function(a){
        var q=a.q, det=DETAILS[q.nodeId]||{}, nt=(det.title&&det.title.name)||q.nodeId;
        html+='<div class="miss"><div class="mq">'+diffBadge(q.difficulty)+' '+esc(q.prompt)+'</div>';
        html+='<div class="ma bad">your answer: '+esc(q.options[a.chosen])+'</div>';
        html+='<div class="ma good">correct: '+esc(q.options[q.answer])+'</div>';
        html+='<div class="mx">'+esc(q.explanation)+' <a href="#" data-study="'+esc(q.nodeId)+'">▸ '+esc(nt)+'</a></div></div>';
      });
      html+='</div>';
    }else{
      html+='<div class="iv-card"><h3>clean sweep 🎉</h3><p class="iv-sub" style="margin:0">No misses — every answer correct.</p></div>';
    }
    html+='<button class="iv-start" id="ivAgain">new quiz →</button>';
    if(misses.length)html+='<button class="qskip" id="ivRetry">retry only the '+misses.length+' missed →</button>';
    html+='</div>';
    ivEl.innerHTML=html;
    ivEl.querySelectorAll('[data-study]').forEach(function(s){s.addEventListener('click',function(e){e.preventDefault();studyNode(s.getAttribute('data-study'));});});
    document.getElementById('ivAgain').addEventListener('click',ivSetup);
    var rt=document.getElementById('ivRetry');
    if(rt)rt.addEventListener('click',function(){quiz={items:misses.map(function(m){return m.q;}),i:0,score:0,answered:[]};ivRenderQ();});
    ivEl.scrollTop=0;
  }

  // ---- interviewer kit ----
  function ivKit(){
    var pool=poolFor(ivCfg.diff);
    var groups={},order=[];
    pool.forEach(function(q){if(!groups[q.topic]){groups[q.topic]=[];order.push(q.topic);}groups[q.topic].push(q);});
    var html='<div class="iv-wrap"><div class="iv-controls" style="display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap">'
      +'<button class="qskip" id="ivBack" style="width:auto;margin:0">← back</button>'
      +'<button class="qskip" id="ivPrint" style="width:auto;margin:0">🖨 print / PDF</button></div>';
    html+='<div class="iv-h">interviewer kit</div>';
    html+='<div class="iv-sub">'+pool.length+' questions'+(ivCfg.diff==='all'?'':' ('+ivCfg.diff+')')+', answer-keyed with model explanations and a follow-up probe for each. Ask the question, listen, then use the probe to test depth.</div>';
    order.sort();
    order.forEach(function(t){
      html+='<div class="kit-topic">'+esc(t)+'</div>';
      groups[t].forEach(function(q){
        var det=DETAILS[q.nodeId]||{}, nt=(det.title&&det.title.name)||q.nodeId;
        html+='<div class="kit-q"><div class="kp">'+diffBadge(q.difficulty)+' '+esc(q.prompt)+'</div>';
        q.options.forEach(function(o,i){
          html+='<div class="ko'+(i===q.answer?' ans':'')+'">'+(i===q.answer?'✓ ':'○ ')+esc(o)+'</div>';
        });
        html+='<div class="kx">'+esc(q.explanation)+'</div>';
        if(q.probe)html+='<div class="kprobe">↳ probe: '+esc(q.probe)+'</div>';
        html+='<div class="kx" style="border:0;padding-top:6px;color:var(--dim)">tree node: '+esc(nt)+'</div></div>';
      });
    });
    html+='</div>';
    ivEl.innerHTML=html;
    document.getElementById('ivBack').addEventListener('click',ivSetup);
    document.getElementById('ivPrint').addEventListener('click',function(){window.print();});
    ivEl.scrollTop=0;
  }

  // jump from a question to its node detail in the map/list
  function studyNode(id){
    setMode(window.innerWidth<=720?'list':'map');
    document.querySelectorAll('#modeToggle button').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-mode')===mode);});
    setTimeout(function(){openPop(id);},60);
  }

  // ---- stats ----
  function refreshStats(){
    var d=NODES.filter(function(n){return isDone(n.id);}).length;
    var r=NODES.filter(function(n){return status(n.id)==='next';}).length;
    document.getElementById('stats').innerHTML=
      '<span><b>'+NODES.length+'</b> nodes</span>'
      +'<span><b>'+d+'</b> completed</span>'
      +'<span><b>'+r+'</b> next up</span>'
      +'<span><b>'+MAIN.size+'</b> on main path</span>'
      +'<span style="color:var(--green)">all nodes unlocked — explore in any order</span>';
  }
  function refreshAll(){refreshMapStatus();refreshListStatus();refreshStats();}

  // touch hint
  if(window.matchMedia&&window.matchMedia('(pointer:coarse)').matches){
    document.getElementById('hint').textContent='drag to pan · pinch to zoom · tap a node';
  }

  // resize refit (debounced)
  var rt; window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){if(mode==='map')readableView(NODES);},160);});

  // boot
  buildMap(); buildList(); refreshAll();
  // default to list on narrow screens
  if(window.innerWidth<=720)setMode('list'); else {setMode('map');readableView(NODES);}
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){if(mode==='map')readableView(NODES);});
})();
</script>
</body>
</html>
