<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>Synthetic Biology Skill Tree</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
/* Set the theme before first paint so there is no flash of the wrong scheme.
   An explicit choice wins; otherwise follow the OS preference. */
(function(){try{
  var t=localStorage.getItem('synbio-theme');
  if(t!=='light'&&t!=='dark'){
    t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark';
  }
  document.documentElement.setAttribute('data-theme',t);
}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();
</script>
<style>
  /* Inter: an open, Helvetica-style neo-grotesque. --mono/--disp are kept as
     names so every existing rule keeps working; both now resolve to Inter. */
  :root{
    --sans:'Inter','Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;
    --mono:var(--sans);
    --disp:var(--sans);

    /* ---- dark (default) ---- */
    --bg:#0a0b0a; --bg2:#111311; --ink:#e9f0e2; --dim:#8a9683;
    --green:#c6f24e; --green-dim:#7f9a3a; --orange:#ff7a2f; --line:#2a3226;
    --panel:#14170f; --edge:#3a4531; --edge-hot:#c6f24e;
    --on-accent:#0a0b0a;
    --surface:var(--surface); --surface-2:var(--surface-2); --surface-3:var(--surface-3);
    --node-a:#171b13; --node-b:#0f120c;
    --head-a:#101210; --head-b:#0c0e0c;
    --panel-top-a:#191d12; --panel-top-b:#14170f;
    --track:var(--track); --expl-bg:var(--expl-bg); --tier:var(--tier);
    --info:var(--info); --info-edge:var(--info-edge); --info-a:#0d1620; --info-b:#0b1118;
    --scrim:rgba(4,5,4,.72); --scanline:rgba(255,255,255,.015);
    --shadow:rgba(0,0,0,.5); --shadow-lg:rgba(0,0,0,.7);
    --ok-tint:rgba(198,242,78,.10); --warn-tint:rgba(255,122,47,.10); --warn-ring:rgba(255,122,47,.5);
    --scheme:dark;
  }
  /* ---- light ---- */
  :root[data-theme="light"]{
    --bg:#fcfcfb; --bg2:#f4f5f2; --ink:#16191c; --dim:#5f6a72;
    --green:#4d7c0f; --green-dim:#7ba32f; --orange:#c2410c; --line:#e4e6e1;
    --panel:#ffffff; --edge:#cfd4c9; --edge-hot:#4d7c0f;
    --on-accent:#ffffff;
    --surface:#ffffff; --surface-2:#fafbf8; --surface-3:#ffffff;
    --node-a:#ffffff; --node-b:#f7f8f5;
    --head-a:#ffffff; --head-b:#f6f7f4;
    --panel-top-a:#f7f8f5; --panel-top-b:#ffffff;
    --track:#e6e8e2; --expl-bg:#f5f8ee; --tier:#c9cfc2;
    --info:#1e6fa8; --info-edge:#b8d4e8; --info-a:#f2f8fc; --info-b:#eaf3fa;
    --scrim:rgba(22,25,28,.42); --scanline:rgba(0,0,0,.012);
    --shadow:rgba(16,20,24,.10); --shadow-lg:rgba(16,20,24,.18);
    --ok-tint:rgba(77,124,15,.10); --warn-tint:rgba(194,65,12,.10); --warn-ring:rgba(194,65,12,.45);
    --scheme:light;
  }
  :root{color-scheme:var(--scheme)}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--mono);
    -webkit-font-smoothing:antialiased;overflow:hidden}
  body{background-image:repeating-linear-gradient(0deg,var(--scanline) 0 1px,transparent 1px 3px)}
  a{color:var(--green)}
  #app{position:fixed;inset:0;display:flex;flex-direction:column}

  header{flex:0 0 auto;padding:12px 16px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,var(--head-a),var(--head-b));z-index:20}
  .hrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .brand{font-family:var(--disp);font-weight:800;font-size:18px;letter-spacing:-.021em;color:var(--green);
    text-transform:lowercase;white-space:nowrap}
  .brand small{display:block;font-family:var(--mono);font-weight:400;font-size:10px;color:var(--dim);letter-spacing:.14em;text-transform:uppercase}
  .grow{flex:1 1 auto}
  .toggle{display:flex;border:1px solid var(--edge);border-radius:6px;overflow:hidden}
  .toggle button{background:transparent;color:var(--dim);border:0;padding:7px 12px;font-family:var(--mono);
    font-size:12px;cursor:pointer}
  .toggle button.on{background:var(--green);color:var(--on-accent);font-weight:600}
  .themeBtn{flex:0 0 auto;width:34px;height:34px;border-radius:8px;border:1px solid var(--edge);
    background:var(--surface);color:var(--ink);font-size:15px;line-height:1;cursor:pointer}
  .themeBtn:hover{border-color:var(--green);color:var(--green)}
  .search{flex:1 1 220px;min-width:140px;display:flex;align-items:center;gap:8px;
    border:1px solid var(--edge);border-radius:6px;padding:6px 10px;background:var(--surface-3)}
  .search input{flex:1;background:transparent;border:0;outline:0;color:var(--ink);font-family:var(--mono);font-size:13px}
  .search span{color:var(--dim)}
  .stats{display:flex;gap:14px;font-size:11px;color:var(--dim);margin-top:8px;flex-wrap:wrap}
  .stats b{color:var(--green)}
  .legend{display:flex;gap:14px;font-size:10px;color:var(--dim);margin-top:6px;flex-wrap:wrap}
  .legend i{font-style:normal}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;vertical-align:middle;margin-right:4px}

  main{flex:1 1 auto;position:relative;overflow:hidden}

  /* ---------- MAP ---------- */
  #map{position:absolute;inset:0;cursor:grab;touch-action:none}
  #map.drag{cursor:grabbing}
  #canvas{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
  svg.edges{position:absolute;top:0;left:0;overflow:visible;pointer-events:none}
  .node{position:absolute;transform:translate(-50%,-50%);width:150px;padding:9px 11px;border-radius:9px;
    border:1px solid var(--edge);background:linear-gradient(180deg,var(--node-a),var(--node-b));cursor:pointer;
    transition:border-color .15s,box-shadow .15s,transform .1s;user-select:none}
  .node:hover{border-color:var(--green);box-shadow:0 0 0 1px var(--green),0 6px 24px var(--shadow);z-index:5}
  .node .nt{font-size:11.5px;line-height:1.25;letter-spacing:.01em}
  .node .nm{font-size:9px;color:var(--dim);margin-top:5px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .node .glyphs{font-size:10px;letter-spacing:2px}
  /* every node is open/navigable - 'open' is a soft de-emphasis, never a lock */
  .node.open{opacity:.92}
  .node.next{border-color:var(--orange);box-shadow:0 0 0 1px var(--warn-ring)}
  .node.next::after{content:"";position:absolute;inset:-3px;border-radius:11px;border:1px solid var(--orange);
    animation:pulse 1.6s ease-in-out infinite;pointer-events:none}
  @keyframes pulse{0%,100%{opacity:.15}50%{opacity:.8}}
  .node.done{border-color:var(--green-dim)}
  .node.done .nt{color:var(--green)}
  .node.main{border-left:3px solid var(--green)}
  .node.dim{opacity:.12;filter:grayscale(1)}
  .tierlab{position:absolute;left:8px;font-family:var(--disp);font-weight:800;font-size:11px;color:var(--tier);
    letter-spacing:.2em;writing-mode:vertical-rl;text-transform:uppercase;pointer-events:none}

  .ctl{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;gap:6px;z-index:10}
  .ctl button{width:38px;height:38px;border-radius:8px;border:1px solid var(--edge);background:var(--surface);
    color:var(--ink);font-size:17px;cursor:pointer}
  .ctl button:hover{border-color:var(--green)}
  .hint{position:absolute;left:14px;bottom:12px;font-size:10px;color:var(--dim);z-index:10}

  /* ---------- LIST ---------- */
  #list{position:absolute;inset:0;overflow:auto;padding:16px;display:none}
  .tiergrp{margin-bottom:20px}
  .tiergrp h3{font-family:var(--disp);font-weight:800;font-size:12px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--dim);border-left:3px solid var(--green);padding-left:9px;margin:0 0 10px}
  .li{display:flex;align-items:center;gap:12px;padding:13px 12px;border:1px solid var(--line);border-radius:9px;
    margin-bottom:8px;cursor:pointer;background:var(--surface-2);min-height:54px}
  .li:hover{border-color:var(--green)}
  .li .bar{width:4px;align-self:stretch;border-radius:3px;background:var(--edge)}
  .li.main .bar{background:var(--green)}
  .li .txt{flex:1;min-width:0}
  .li .txt b{font-size:13px;font-weight:400;display:block}
  .li .txt small{color:var(--dim);font-size:10.5px;display:block;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .li .glyphs{font-size:11px;letter-spacing:2px;color:var(--dim)}
  .pill{font-size:9px;padding:3px 7px;border-radius:20px;border:1px solid var(--edge);color:var(--dim);white-space:nowrap}
  .pill.next{color:var(--orange);border-color:var(--orange)}
  .pill.done{color:var(--green);border-color:var(--green-dim)}
  .pill.open{color:var(--dim);border-color:var(--edge)}

  /* ---------- INTERVIEW ---------- */
  #interview{position:absolute;inset:0;overflow:auto;padding:22px 18px 60px;display:none}
  .iv-wrap{max-width:760px;margin:0 auto}
  .iv-h{font-family:var(--disp);font-weight:800;font-size:22px;letter-spacing:-.024em;margin:4px 0 4px}
  .iv-sub{color:var(--dim);font-size:12.5px;line-height:1.5;margin-bottom:20px}
  .iv-card{border:1px solid var(--edge);border-radius:12px;background:var(--surface-2);padding:18px;margin-bottom:16px}
  .iv-card h3{font-family:var(--disp);font-weight:800;font-size:13px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--green);margin:0 0 12px}
  .roles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .role{border:1px solid var(--edge);border-radius:11px;padding:16px;cursor:pointer;background:var(--surface);transition:border-color .15s}
  .role:hover,.role.sel{border-color:var(--green);box-shadow:0 0 0 1px var(--green)}
  .role b{display:block;font-family:var(--disp);font-weight:800;font-size:15px;letter-spacing:-.018em;margin-bottom:6px}
  .role small{color:var(--dim);font-size:11.5px;line-height:1.45;display:block}
  .role .ic{font-size:22px;margin-bottom:8px;display:block}
  .fld{margin-bottom:14px}
  .fld label{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:7px}
  .chips{display:flex;gap:7px;flex-wrap:wrap}
  .chip{border:1px solid var(--edge);border-radius:20px;padding:7px 13px;font-size:12px;cursor:pointer;color:var(--dim);background:transparent}
  .chip.on{background:var(--green);color:var(--on-accent);border-color:var(--green);font-weight:700}
  .iv-start{width:100%;padding:14px;border:0;border-radius:10px;background:var(--green);color:var(--on-accent);
    font-family:var(--mono);font-weight:700;font-size:14px;cursor:pointer;margin-top:4px}
  .iv-start:disabled{background:var(--surface);color:var(--dim);cursor:not-allowed}

  .qbar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .qbar .prog{flex:1;height:6px;border-radius:6px;background:var(--track);overflow:hidden}
  .qbar .prog i{display:block;height:100%;background:var(--green);width:0;transition:width .25s}
  .qbar .cnt{font-size:11px;color:var(--dim);white-space:nowrap}
  .qbar .sc{font-size:11px;color:var(--green);white-space:nowrap}
  .qmeta{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
  .badge{font-size:9px;letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;border-radius:20px;border:1px solid var(--edge);color:var(--dim)}
  .badge.f{color:var(--info);border-color:var(--info-edge)}
  .badge.c{color:var(--green);border-color:var(--green-dim)}
  .badge.a{color:var(--orange);border-color:var(--orange)}
  .qprompt{font-size:16px;line-height:1.5;margin:0 0 16px;font-weight:700}
  .opt{display:block;width:100%;text-align:left;border:1px solid var(--edge);border-radius:10px;padding:13px 14px;
    margin-bottom:9px;background:var(--surface);color:var(--ink);font-family:var(--mono);font-size:13px;line-height:1.45;cursor:pointer;transition:border-color .12s}
  .opt:hover:not(:disabled){border-color:var(--green)}
  .opt .k{display:inline-block;width:20px;color:var(--dim);font-weight:700}
  .opt.correct{border-color:var(--green);background:var(--ok-tint);color:var(--green)}
  .opt.wrong{border-color:var(--orange);background:var(--warn-tint);color:var(--orange)}
  .opt:disabled{cursor:default}
  .expl{border-left:3px solid var(--green);background:var(--expl-bg);padding:12px 14px;border-radius:0 8px 8px 0;margin:6px 0 14px}
  .expl b{color:var(--green);font-size:11px;letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:6px}
  .expl p{font-size:12.5px;line-height:1.55;margin:0 0 8px}
  .expl .probe{color:var(--dim);font-size:11.5px;font-style:italic}
  .expl a{font-size:11.5px}
  .qnext{width:100%;padding:13px;border:0;border-radius:10px;background:var(--green);color:var(--on-accent);font-family:var(--mono);font-weight:700;font-size:13px;cursor:pointer}
  .qskip{width:100%;padding:11px;border:1px solid var(--edge);border-radius:10px;background:transparent;color:var(--dim);font-family:var(--mono);font-size:12px;cursor:pointer;margin-top:8px}

  .score-big{font-family:var(--disp);font-weight:800;font-size:52px;letter-spacing:-.03em;color:var(--green);line-height:1}
  .score-lbl{color:var(--dim);font-size:12px;margin-top:6px}
  .brk{display:flex;flex-direction:column;gap:8px;margin:14px 0}
  .brk-row{display:flex;align-items:center;gap:10px;font-size:12px}
  .brk-row .nm{flex:0 0 150px;color:var(--dim)}
  .brk-row .bar2{flex:1;height:8px;border-radius:6px;background:var(--track);overflow:hidden}
  .brk-row .bar2 i{display:block;height:100%;background:var(--green)}
  .brk-row .v{flex:0 0 52px;text-align:right;color:var(--ink)}
  .miss{border:1px solid var(--line);border-radius:10px;padding:13px;margin-bottom:10px}
  .miss .mq{font-size:13px;font-weight:700;margin-bottom:8px}
  .miss .ma{font-size:12px;margin:3px 0}
  .miss .ma.good{color:var(--green)}
  .miss .ma.bad{color:var(--orange)}
  .miss .mx{font-size:11.5px;color:var(--dim);line-height:1.5;margin-top:6px}

  /* interviewer kit */
  .kit-q{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
  .kit-q .kp{font-size:13.5px;font-weight:700;margin-bottom:9px}
  .kit-q .ko{font-size:12px;color:var(--dim);margin:3px 0;padding-left:6px}
  .kit-q .ko.ans{color:var(--green);font-weight:700}
  .kit-q .kx{font-size:12px;color:var(--ink);line-height:1.55;margin-top:9px;border-top:1px solid var(--line);padding-top:9px}
  .kit-q .kprobe{font-size:11.5px;color:var(--orange);margin-top:7px;font-style:italic}
  .kit-topic{font-family:var(--disp);font-weight:800;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:18px 0 10px}
  @media print{
    header,.iv-controls{display:none!important}
    #interview{position:static;overflow:visible}
    body{background:#fff;color:#000}
    .kit-q{border-color:#ccc;break-inside:avoid}
    .kit-q .ko.ans{color:#060}
  }
  @media (max-width:720px){.roles{grid-template-columns:1fr}.brk-row .nm{flex-basis:110px}}

  /* ---------- POPUP ---------- */
  #scrim{position:fixed;inset:0;background:var(--scrim);backdrop-filter:blur(3px);z-index:40;
    display:none;align-items:center;justify-content:center;padding:20px}
  #scrim.show{display:flex}
  #pop{width:min(640px,100%);max-height:88vh;overflow:auto;background:var(--panel);border:1px solid var(--edge);
    border-radius:14px;box-shadow:0 24px 80px var(--shadow-lg);animation:pin .18s ease}
  @keyframes pin{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
  #pop .top{position:sticky;top:0;background:linear-gradient(180deg,var(--panel-top-a),var(--panel-top-b));padding:16px 18px;
    border-bottom:1px solid var(--edge);display:flex;gap:12px;align-items:flex-start}
  #pop .top .x{margin-left:auto;background:transparent;border:1px solid var(--edge);color:var(--ink);
    width:30px;height:30px;border-radius:7px;cursor:pointer;font-size:15px;flex:0 0 auto}
  #pop h2{font-family:var(--disp);font-weight:800;font-size:20px;margin:0;letter-spacing:-.022em}
  #pop .meta{font-size:10px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;margin-top:6px}
  #pop .body{padding:16px 18px}
  #pop section{margin-bottom:18px}
  #pop h4{font-family:var(--disp);font-weight:800;font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--green);margin:0 0 8px}
  #pop p{font-size:13px;line-height:1.55;color:var(--ink);margin:0 0 8px}
  #pop ul{margin:0;padding-left:18px}
  #pop li{font-size:12.5px;line-height:1.5;margin-bottom:5px}
  .req{display:flex;align-items:center;gap:8px;font-size:12.5px;margin-bottom:5px}
  .req .m{font-size:13px}
  .req.ok{color:var(--green)}.req.no{color:var(--dim)}
  .req a.jump{color:inherit;text-decoration:none;border-bottom:1px dotted currentColor}
  .req a.jump:hover{color:var(--green);border-bottom-color:var(--green)}
  .freenote{font-size:11px;color:var(--dim);font-style:italic;margin-top:8px;padding-left:2px}
  .steps{counter-reset:s}
  .step{display:flex;gap:11px;margin-bottom:9px}
  .step .n{flex:0 0 auto;width:22px;height:22px;border-radius:50%;border:1px solid var(--edge);
    display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--green)}
  .step b{font-size:12.5px;font-weight:700}
  .step small{display:block;font-size:11.5px;color:var(--dim);margin-top:2px}
  .vid{position:relative;aspect-ratio:16/9;border-radius:9px;overflow:hidden;border:1px solid var(--edge);background:#000}
  .vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .watch{display:inline-flex;align-items:center;gap:8px;padding:11px 14px;border:1px solid var(--edge);
    border-radius:9px;color:var(--green);text-decoration:none;font-size:12.5px}
  .watch:hover{border-color:var(--green)}
  .res a{display:block;padding:9px 11px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;
    font-size:12px;text-decoration:none;color:var(--ink)}
  .res a:hover{border-color:var(--green);color:var(--green)}
  .res a span{color:var(--dim);font-size:10px}
  .htgaa{border:1px solid var(--info-edge);border-radius:10px;background:linear-gradient(180deg,var(--info-a),var(--info-b));padding:13px 15px}
  .htgaa .hh{display:flex;align-items:center;gap:8px;font-family:var(--disp);font-weight:800;font-size:11px;
    letter-spacing:.12em;text-transform:uppercase;color:var(--info);margin-bottom:8px}
  .htgaa .wk{font-size:13px;font-weight:700;margin-bottom:3px}
  .htgaa .mod{font-size:12.5px;color:var(--ink);margin-bottom:6px}
  .htgaa .who{font-size:11.5px;color:var(--dim);margin-bottom:9px}
  .htgaa a{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--info);text-decoration:none;
    border:1px solid var(--info-edge);border-radius:7px;padding:6px 10px}
  .htgaa a:hover{border-color:var(--info)}
  .cta{width:100%;padding:12px;border-radius:9px;border:0;font-family:var(--mono);font-weight:700;font-size:13px;cursor:pointer}
  .cta.go{background:var(--green);color:var(--on-accent)}
  .cta.done{background:transparent;color:var(--green);border:1px solid var(--green-dim)}
  .cta.wait{background:var(--surface);color:var(--dim);cursor:not-allowed}

  @media (max-width:720px){
    .stats,.legend{display:none}
    #scrim{padding:0;align-items:flex-end}
    #pop{width:100%;max-height:90vh;border-radius:16px 16px 0 0}
    .brand{font-size:16px}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="hrow">
      <div class="brand">synbio skill tree<small>sterile bench → purified protein</small></div>
      <div class="grow"></div>
      <div class="toggle" id="modeToggle">
        <button data-mode="map" class="on">◆ map</button>
        <button data-mode="list">☰ list</button>
        <button data-mode="interview">◇ interview</button>
      </div>
      <button class="themeBtn" id="themeBtn" type="button" aria-label="Toggle light or dark theme">◐</button>
    </div>
    <div class="hrow" style="margin-top:10px">
      <label class="search"><span>⌕</span><input id="q" placeholder="search techniques, objectives, projects…" autocomplete="off"></label>

ence formats, quality scores, alignment, and Biopython/pandas scripting.","defaultStatus":"inProgress","link":"/bioinformatics","initialPosition":[3.0,22.4],"dependencies":["sequencing"]},{"id":"doe-statistics","title":"design of experiments & rigor","description":"DoE over one-factor-at-a-time, replication, controls, and avoiding p-hacking.","defaultStatus":"inProgress","link":"/doe-statistics","initialPosition":[-3.6,23.8],"dependencies":["intro"]},{"id":"biosafety-biosecurity","title":"biosafety & biosecurity","description":"BSL levels, containment, dual-use (DURC) governance, and DNA-synthesis screening.","defaultStatus":"inProgress","link":"/biosafety-biosecurity","initialPosition":[-1.4,23.8],"dependencies":["host-selection"]},{"id":"flow-cytometry","title":"flow cytometry & facs","description":"Single-cell analysis and sorting by scatter and fluorescence; gating and compensation.","defaultStatus":"inProgress","link":"/flow-cytometry","initialPosition":[0.8,23.8],"dependencies":["mammalian-cell-culture"]},{"id":"ngs-analysis","title":"ngs data analysis","description":"Read QC, alignment, coverage, and variant calling / RNA-seq pipelines (nf-core).","defaultStatus":"inProgress","link":"/ngs-analysis","initialPosition":[3.0,23.8],"dependencies":["bioinformatics"]},{"id":"directed-evolution","title":"directed evolution","description":"Generate diversity and select/screen for improved variants over iterative rounds.","defaultStatus":"inProgress","link":"/directed-evolution","initialPosition":[-1.4,25.2],"dependencies":["pcr","plasmid-insertion"]},{"id":"ml-for-biology","title":"ml / ai for biology","description":"Foundation models (ESM, AlphaFold), generative design, and leakage-proof evaluation.","defaultStatus":"inProgress","link":"/ml-for-biology","initialPosition":[0.8,25.2],"dependencies":["bioinformatics","protein-design"]},{"id":"biomanufacturing","title":"bioprocess & biomanufacturing","description":"Scale flask to bioreactor: batch/fed-batch, oxygen transfer, and GMP/quality-by-design.","defaultStatus":"inProgress","link":"/biomanufacturing","initialPosition":[3.0,25.2],"dependencies":["protein-induction"]}],"mainPathNodes":["intro","sterile-workspace","media-plates","sterile-technique","miniprep","gel-electrophoresis","pcr","restriction-digest","ligation","confirmation","proteins101","protein-induction","affinity-purification","sds-page","final-project"]},"details":{"advanced-omics":{"treeId":"synthetic-biology","id":"advanced-omics","title":{"name":"beyond the bench: rna, omics & bio-programming","level":8},"project":"Future Directions","video":{"url":""},"time":240,"level":"advanced","overview":{"description":"The guide's frontier: antibody production, Western/Eastern blots, ELISA, aptamers and mass spec for proteomes; RNA purification, RT-PCR/RT-qPCR and Northern blots for transcriptomes; plus gene switches, omics and advanced biological programming. Pick a thread and go deep.","objectives":["survey proteome analysis (Western blot, ELISA, mass spec)","survey RNA workflows (RT-PCR, RT-qPCR, Northern blot)","explore gene switches, omics and advanced biological programming"],"prerequisites":["the capstone"]},"steps":{"description":"The guide's frontier: antibody production, Western/Eastern blots, ELISA, aptamers and mass spec for proteomes; RNA purification, RT-PCR/RT-qPCR and Northern blots for transcriptomes; plus gene switches, omics and advanced biological programming. Pick a thread and go deep.","intro":"The guide's frontier: antibody production, Western/Eastern blots, ELISA, aptamers and mass spec for proteomes; RNA purification, RT-PCR/RT-qPCR and Northern blots for transcriptomes; plus gene switches, omics and advanced biological programming. Pick a thread and go deep.","tools":["depends on the chosen sub-topic"],"estimatatedTime":{"setup":40,"config":80,"testing":80},"instructions":[{"title":"Pick a track","description":"Choose proteome analysis, RNA/transcriptomics, or biological programming."},{"title":"  FPLC scales this up; gravity columns work on a budget.","intro":"With an affinity tag (designed in at the gBlock stage), purification is tractable: the tag binds a substrate (His-tag to Ni-NTA), contaminants wash away, then a competitor (imidazole) elutes your protein. FPLC scales this up; gravity columns work on a budget.","tools":["Ni-NTA resin / spin columns","binding/wash/elution buffers","imidazole","centrifuge or gravity column"],"estimatatedTime":{"setup":25,"config":50,"testing":50},"instructions":[{"title":"Bind","description":"Apply cleared lysate to equilibrated Ni-NTA resin so the His-tag binds the nickel."},{"title":"Wash","description":"Wash with low-imidazole buffer (~20-30 mM) to remove weakly-bound contaminants."},{"title":"Elute","description":"Elute with high imidazole (~250-500 mM); collect fractions for analysis."},{"title":"Analyse","description":"Save load, flow-through, wash and elution fractions for SDS-PAGE."}]},"submission":{"description":"Purify a tagged protein and submit the fraction set (load/FT/wash/elution) ready for an SDS-PAGE gel."},"resources":[{"title":"NeoSynBio: Affinity Tag Purification","url":"https://www.neosynbio.com/affinity-tag-purification"},{"title":"Thermo Fisher: His-tagged protein production & purification","url":"https://www.thermofisher.com/us/en/home/life-science/protein-biology/protein-biology-learning-center/protein-biology-resource-library/pierce-protein-methods/his-tagged-proteins-production-purification.html"},{"title":"Thermo Fisher: HisPur Ni-NTA purification kit handbook","url":"https://assets.fishersci.com/TFS-Assets/LSG/manuals/MAN0011702_HisPur_NiNTA_Purifi_UG.pdf"},{"title":"Hebrew University: small-scale His-tag purification protocol","url":"https://wolfson.huji.ac.il/purification/TagProteinPurif/HisTag_nature.htm"}]},"backbone-selection":{"treeId":"synthetic-biology","id":"backbone-selection","title":{"name":"backbone selection (theory)","level":2},"project":"Experimental Design","video":{"url":""},"time":40,"level":"intermediate","overview":{"description":"Professionals call plasmids 'backbones' and match the backbone to the situation. For a first project, pick a simple plasmid with high copy number and an easy-to-source antibiotic - e.g. pET-15b or an iGEM pSB1C3.","objectives":["select a backbone by copy number, resistance and MCS","match a backbone to your expression goal","find and download sequences from Addgene"],"prerequisites":["Plasmids101"]},"steps":{"description":"Professionals call plasmids 'backbones' and match the backbone to the situation. For a first project, pick a simple plasmid with high copy number and an easy-to-source antibiotic - e.g. pET-15b or an iGEM pSB1C3.","intro":"Professionals call plasmids 'backbones' and match the backbone to the situation. For a first project, pick a simple plasmid with high copy number and an easy-to-source antibiotic - e.g. pET-15b or an iGEM pSB1C3.","tools":["Addgene","sequence viewer"],"estimatatedTime":{"setup":6,"config":13,"testing":13},"instructions":[{"title":"List requirements","description":"Decide copy number, resistance marker, promoter and whether you need an affinity tag."},{"title":"Shortlist backbones","description":"Compare candidates (pET-15b, pSB1C3, etc.) against your requirements."},{"title":"Download the sequence","description":"Pull the annotated .dna/.gb file from Addgene for in-silico design."}]},"submission":{"description":"Choose a backbone, justify it against your requirements, and attach the annotated sequence file."},"resources":[{"title":"NeoSynBio: Backbone Selection","url":"https://www.neosynbio.com/backbone-selection"},{"title":"Addgene: Choosing your perfect plasmid backbone","url":"https://blog.addgene.org/plasmids-101-choosing-your-perfect-plasmid-backbone"},{"title":"iGEM Registry: pSB1C3 and standard backbones","url":"https://parts.igem.org/Plasmid_backbones/Assembly"}]},"biofabrication":{"treeId":"synthetic-biology","id":"biofabrication","title":{"name":"bio design & biofabrication","level":8},"project":"Bio Design","video":{"url":""},"time":180,"level":"advanced","overview":{"description":"Grow materials and objects instead of manufacturing them: engineered living materials, mycelium composites, bacterial cellulose, and biofabricated design. This module bridges biology and design - treating living systems as a fabrication substrate with its own constraints of growth, scale, and sustainability.","objectives":["design an object or material to be grown, not built","cultivate a biomaterial (mycelium, bacterial cellulose)","weigh scale, reproducibility, and sustainability trade-offs","integrate engineered biology with design intent"],"prerequisites":["Final Project (integrated wet-lab skills)"]},"steps":{"description":"Choose a living material, define the growth process and mould/scaffold, cultivate under controlled conditions, then post-process into a finished form.","intro":"Biofabrication is design with a partner that grows: you set conditions and boundaries, and the organism builds the material.","tools":["a living material system (mycelium / Komagataeibacter for cellulose)","substrate + mould/scaffold","sterile growth setup","post-processing (drying, pressing, finishing)"],"estimatatedTime":{"setup":45,"config":90,"testing":45},"instructions":[{"title":"Choose the material & form","description":"Pick a system (mycelium composite, bacterial cellulose, etc.) and the object/material properties you want."},{"title":"Prepare substrate & scaffold","description":"Formulate the substrate and build a mould or scaffold that guides growth into the target shape."},{"title":"Cultivate","description":"Inoculate and grow under controlled, contamination-free conditions until the material sets."},{"title":"Finish & evaluate","description":"Dry/press/treat the material, then evaluate strength, reproducibility, and sustainability against the design goal."}]},"submission":{"description":"Propose a biofabricated object or material: the organism/system, the growth-and-mould process, and an honest assessment of scale and sustainability."},"resources":[{"title":"HTGAA - Bio Design & Bio Fabrication (Week 14)","url":"https://2026a.htgaa.org/"},{"title":"Ecovative - mycelium biomaterials","url":"https://www.ecovative.com/"},{"title":"Biofabricate - grown-materials design community","url":"https://www.biofabricate.co/"}]},"bioinformatics":{"treeId":"synthetic-biology","id":"bioinformatics","title":{"name":"bioinformatics foundations","level":6},"project":"Data & Informatics","video":{"url":"https://www.youtube.com/watch?v=WRKQGwh_Mw0"},"time":150,"level":"advanced","overview":{"description":"Read, wrangle, and analyse biological sequence data: FASTA/FASTQ formats, quality scores, alignment (BLAST/Bowtie), and scripting with Biopython/pandas. Nearly every wet-lab result now flows through a command line before it means anything.","objectives":["work with sequence formats (FASTA, FASTQ, SAM/BAM, VCF)","read Phred quality scores and trim/QC reads","align sequences and interpret BLAST results","script analyses with Biopython / pandas and the command line"],"prerequisites":["Sanger sequencing"]},"steps":{"description":"Read, wrangle, and analyse biological sequence data: FASTA/FASTQ formats, quality scores, alignment (BLAST/Bowtie), and scripting with Biopython/pandas. Nearly every wet-lab result now flows through a command line before it means anything.","intro":"Bioinformatics is data literacy for biology - the ability to take raw files off an instrument and turn them into an answer, reproducibly.","tools":["command line (bash)","Biopython / pandas","alignment tools (BLAST, Bowtie2, minimap2)","a notebook (Jupyter)"],"estimatatedTime":{"setup":40,"config":80,"testing":40},"instructions":[{"title":"Know your formats","description":"Recognise FASTA (sequence) vs FASTQ (sequence + per-base Phred quality) and downstream SAM/BAM/VCF."},{"title":"QC first","description":"Assess read quality (FastQC), trim adapters/low-quality bases before any analysis."},{"title":"Align & interpret","description":"Map reads or BLAST a query; understand e-value, identity, and coverage before trusting a hit."},{"title":"Script it","description":"Automate parsing and summary with Biopython/pandas so the analysis is reproducible, not click-by-click."}]},"submission":{"description":"Take a raw FASTQ, QC and trim it, align or BLAST it, and produce a short reproducible summary - explaining each quality decision."},"resources":[{"title":"Biopython tutorial","url":"https://biopython.org/wiki/Documentation"},{"title":"Rosalind - learn bioinformatics by problem-solving","url":"https://rosalind.info/"}]},"biomanufacturing":{"treeId":"synthetic-biology","id":"biomanufacturing","title":{"name":"bioprocess & biomanufacturing","level":7},"project":"Bioprocess","video":{"url":"https://www.youtube.com/watch?v=o4mRJOeuXJI"},"time":150,"level":"advanced","overview":{"description":"Scaling from a shake flask to a bioreactor is its own discipline: batch vs fed-batch, oxygen transfer and mixing limits, and the shift into GMP/quality-by-design for anything therapeutic. This is where synbio meets a P&L.","objectives":["compare batch, fed-batch, and continuous processes","explain why oxygen transfer and mixing limit scale-up","monitor and control a bioreactor (pH, DO, temperature, feed)","understand GMP / quality-by-design at a high level"],"prerequisites":["Protein Induction"]},"steps":{"description":"Scaling from a shake flask to a bioreactor is its own discipline: batch vs fed-batch, oxygen transfer and mixing limits, and the shift into GMP/quality-by-design for anything therapeutic. This is where synbio meets a P&L.","intro":"Cells behave differently at 10 L than at 10 mL: gradients in oxygen, pH, and nutrients appear, so scale-up is about engineering the environment, not just growing more.","tools":["bioreactor / fermenter","process controls (pH, dissolved oxygen, feed pumps)","analytics for titer/quality","a QbD/GMP framework for regulated products"],"estimatatedTime":{"setup":40,"config":80,"testing":40},"instructions":[{"title":"Define the process mode","description":"Choose batch, fed-batch, or continuous based on product, growth, and inhibition; set the feed strategy."},{"title":"Control the environment","description":"Maintain pH, dissolved oxygen, and temperature; recognise oxygen transfer (kLa) and mixing as the usual scale-up bottlenecks."},{"title":"Monitor & sample","description":"Track growth, titer, and byproducts; keep the process in its validated window."},{"title":"Think quality","description":"For regulated products, design for GMP/QbD - critical quality attributes and process parameters defined up front."}]},"submission":{"description":"Propose a scale-up plan from flask to bioreactor for an expressed protein: process mode, the control parameters, and the scale-up risks (oxygen, mixing, shear)."},"resources":[{"title":"Bioprocessing basics (overview)","url":"https://en.wikipedia.org/wiki/Bioprocess_engineering"},{"title":"FDA - Quality by Design / GMP overview","url":"https://www.fda.gov/drugs/pharmaceutical-quality-resources/current-good-manufacturing-practice-cgmp-regulations"}]},"biosafety-biosecurity":{"treeId":"synthetic-biology","id":"biosafety-biosecurity","title":{"name":"biosafety & biosecurity","level":5},"project":"Biosafety","video":{"url":"https://www.youtube.com/watch?v=c7mIhF8p3Hs"},"time":150,"level":"advanced","overview":{"description":"Responsible practice is now a hiring requirement: biosafety levels (BSL-1 to 4) protect people and environment, while biosecurity and dual-use (DURC) governance protect against misuse. Knowing containment, IBC approval, and synthesis screening is table stakes.","objectives":["match work to the right biosafety level (BSL-1 to BSL-4)","apply containment, PPE, and waste/decontamination practices","understand dual-use research of concern (DURC) and responsible innovation","know that synthesized DNA is screened and why (biosecurity)"],"prerequisites":["Host selection criteria"]},"steps":{"description":"Responsible practice is now a hiring requirement: biosafety levels (BSL-1 to 4) protect people and environment, while biosecurity and dual-use (DURC) governance protect against misuse. Knowing containment, IBC approval, and synthesis screening is table stakes.","intro":"Biosafety protects against accidents; biosecurity protects against misuse. Both are professional obligations - and increasingly, legal and funding requirements - not optional extras.","tools":["risk assessment framework","the correct BSL facility + PPE","an IBC / institutional approval process","DNA-synthesis screening awareness (IGSC)"],"estimatatedTime":{"setup":40,"config":80,"testing":40},"instructions":[{"title":"Assess the risk","description":"Classify the agent and work; determine the required biosafety level and containment."},{"title":"Contain & protect","description":"Use the right facility, PPE, and validated decontamination/waste procedures for that BSL."},{"title":"Get oversight","description":"Route recombinant/dual-use work through the appropriate committee (IBC) and follow DURC policy."},{"title":"Think biosecurity","description":"Understand that gene-synthesis providers screen orders against pathogens/toxins, and design work responsibly from the start."}]},"submission":{"description":"Given a proposed experiment, assign the biosafety level and containment, and identify any dual-use/biosecurity concerns and the oversight it would require."},"resources":[{"title":"CDC/NIH - Biosafety in Microbiological & Biomedical Labs (BMBL)","url":"https://www.cdc.gov/labs/BMBL.html"},{"title":"NIH - Dual Use Research of Concern (DURC)","url":"https://osp.od.nih.gov/policies/dual-use-research-of-concern/"},{"title":"International Gene Synthesis Consortium - screening","url":"https://genesynthesisconsortium.org/"}]},"buffer-mixing":{"treeId":"synthetic-biology","id":"buffer-mixing","title":{"name":"diy buffer mixing","level":1},"project":"Reagent Prep","video":{"url":""},"time":60,"level":"intermediate","overview":{"description":"Buffers resist pH change and you'll use them for nearly everything. Mixing your own can save thousands in a community lab, but involves deadly compounds in pure form (e.g. HCl, guanidine thiocyanate). Solo hobbyists should usually buy pre-mixed.","objectives":["understand what buffers do (resisting pH change)","weigh DIY vs commercial buffers on cost and safety","handle hazardous pure compounds with correct PPE","calibrate and use a pH meter"],"prerequisites":["the sterile workspace and PPE"]},"steps":{"description":"Buffers resist pH change and you'll use them for nearly everything. Mixing your own can save thousands in a community lab, but involves deadly compounds in pure form (e.g. HCl, guanidine thiocyanate). Solo hobbyists should usually buy pre-mixed.","intro":"Buffers resist pH change and you'll use them for nearly everything. Mixing your own can save thousands in a community lab, but involves deadly compounds in pure form (e.g. HCl, guanidine thiocyanate). Solo hobbyists should usually buy pre-mixed.","tools":["pH meter","balance","fume hood or excellent ventilation","full PPE"],"estimatatedTime":{"setup":10,"config":20,"testing":20},"instructions":[{"title":"Decide DIY vs buy","description":"Solo and can't source pure acids safely? Buy pre-mixed. In a funded community lab? DIY can cut huge costs."},{"title":"Suit up for chemicals","description":"Pure compounds are far more dangerous than the diluted reagents you've used so far. Read every MSDS."},{"title":"Calibrate the pH meter","description":"Two- or three-point calibrate against standard buffers before measuring; titrate carefully to target pH."}]},"submission":{"description":"Mix one simple buffer (e.g. 1x TAE) from scratch, record the recipe and final measured pH, and note the hazards you mitigated."},"resources":[{"title":"NeoSynBio: DIY Buffer Mixing protocols","url":"https://www.neosynbio.com/diy-buffer-mixing"},{"title":"NeoSynBio: pH Meter equipment guide","url":"https://www.neosynbio.com/ph-meter"},{"title":"Cold Spring Harbor Protocols: buffers & stock solutions","url":"https://cshprotocols.cshlp.org/"}]},"building-genomes":{"treeId":"synthetic-biology","id":"building-genomes","title":{"name":"building genomes","level":8},"project":"Genome-Scale","video":{"url":""},"time":240,"level":"advanced","overview":{"description":"Design and assemble DNA at genome scale: minimal genomes (JCVI-syn3.0), the synthetic yeast Sc2.0, and whole-genome recoding to free up codons. Everything is hierarchical - oligos to genes to cassettes to chromosomes - and installation uses transplantation or CRISPR-based methods.","objectives":["plan hierarchical assembly of a genome-scale construct","explain minimal-genome and genome-recoding concepts","compare genome-installation methods (transplantation, iterative editing)","reason about error rate and verification at scale"],"prerequisites":["Golden Gate / Gibson assembly","CRISPR / Cas9"]},"steps":{"description":"Break a genome design into buildable tiers, synthesise and assemble bottom-up with error checking at each level, then install and verify.","intro":"You cannot synthesise a chromosome in one piece - genome engineering is a hierarchy of assemblies, each verified before it becomes a part in the next.","tools":["DNA synthesis + hierarchical assembly (Gibson/Golden Gate/yeast assembly)","genome-design software","a host for installation","long-read sequencing for verification"],"estimatatedTime":{"setup":60,"config":120,"testing":60},"instructions":[{"title":"Design & segment","description":"Design the target sequence (e.g. recode codons, remove/refactor elements) and split it into synthesisable segments with defined junctions."},{"title":"Assemble hierarchically","description":"Build oligos to genes to cassettes to megabase segments, sequence-verifying at each tier so errors do not propagate."},{"title":"Install","description":"Introduce the synthetic DNA into a host by transplantation or iterative CRISPR-based replacement."},{"title":"Verify function","description":"Confirm the genome with long-read sequencing and test viability/phenotype of the engineered strain."}]},"submission":{"description":"Outline a genome-scale project (minimal genome, recoding, or a large refactor): the hierarchical assembly plan, the installation method, and how you would verify it."},"resources":[{"title":"HTGAA - Building Genomes (Week 12)","url":"https://2026a.htgaa.org/"},{"title":"JCVI - minimal synthetic cell (Syn3.0)","url":"https://www.jcvi.org/research/first-minimal-synthetic-bacterial-cell"},{"title":"Sc2.0 - the synthetic yeast genome project","url":"https://syntheticyeast.github.io/"}]},"cell-free":{"treeId":"synthetic-biology","id":"cell-free","title":{"name":"cell-free systems (TX-TL)","level":6},"project":"Cell-Free","video":{"url":"https://www.youtube.com/watch?v=pTAozxV2rKo"},"time":120,"level":"advanced","overview":{"description":"Run transcription and translation outside a living cell, in a crude extract or the reconstituted PURE system. With no membrane and no growth to worry about, cell-free is fast to prototype, tolerant of toxic products, and can be freeze-dried into portable biosensors.","objectives":["run a TX-TL reaction expressing a reporter from added DNA","prototype a genetic circuit cell-free in hours, not days","build a freeze-dried, field-deployable biosensor","know when cell-free beats in-vivo expression (toxicity, speed, control)"],"prerequisites":["Proteins 101","PCR (to make linear templates)"]},"steps":{"description":"Add DNA (plasmid or linear PCR product) to an extract plus energy mix, incubate, and read the reporter - no transformation, no culturing.","intro":"Cell-free turns gene expression into a pipetting reaction: template + extract + energy + amino acids in a tube, output in a plate reader within hours.","tools":["cell extract or PURE system (e.g. myTXTL)","energy/amino-acid supplement mix","DNA template (plasmid or PCR)","plate reader for fluorescence/luminescence"],"estimatatedTime":{"setup":30,"config":45,"testing":45},"instructions":[{"title":"Prepare template","description":"Use a plasmid or a linear PCR product with a strong promoter/RBS; linear templates are quick but degrade faster."},{"title":"Assemble the reaction","description":"Combine extract, energy mix, and template on ice; keep reactions small (a few uL) and set up replicates + a no-DNA control."},{"title":"Incubate & read","description":"Incubate at ~29-37 C and track reporter signal in real time on a plate reader."},{"title":"Prototype or preserve","description":"Iterate circuit variants rapidly, or freeze-dry reactions onto paper for a portable biosensor."}]},"submission":{"description":"Design a cell-free experiment that expresses a reporter from your DNA, including the controls, and explain why cell-free is the right choice for your application."},"resources":[{"title":"HTGAA - Cell-Free Systems (Week 9)","url":"https://2026a.htgaa.org/"},{"title":"myTXTL cell-free expression (overview)","url":"https://arborbiosciences.com/products/cell-free-protein-expression/"},{"title":"Pardee et al. - paper-based freeze-dried synthetic biology","url":"https://pubmed.ncbi.nlm.nih.gov/25417167/"}]},"cell-lysis":{"treeId":"synthetic-biology","id":"cell-lysis","title":{"name":"cell lysis","level":7},"project":"Protein Production","video":{"url":""},"time":90,"level":"intermediate","overview":{"description":"Once your protein is made, you have to extract it - 'there are many ways to skin E. coli'. Lysis releases everything inside the cell as 'cell slurry'; the right enzymes/inhibitors protect your protein of interest during the process.","objectives":["choose a lysis method (chemical, sonication, bead-beating)","include protease inhibitors and keep samples cold","clarify lysate to separate soluble protein"],"prerequisites":["induced cell pellet"]},"steps":{"description":"Once your protein is made, you have to extract it - 'there are many ways to skin E. coli'. Lysis releases everything inside the cell as 'cell slurry'; the right enzymes/inhibitors protect your protein of interest during the process.","intro":"Once your protein is made, you have to extract it - 'there are many ways to skin E. coli'. Lysis releases everything inside the cell as 'cell slurry'; the right enzymes/inhibitors protect your protein of interest during the process.","tools":["lysis buffer / detergent reagent","sonicator or bead beater","protease inhibitors","centrifuge"],"estimatatedTime":{"setup":15,"config":30,"testing":30},"instructions":[{"title":"Resuspend cold","description":"Resuspend the pellet in cold lysis buffer with protease inhibitors; keep on ice throughout."},{"title":"Lyse","description":"Sonicate (pulsed, on ice) or bead-beat until the cloudy suspension turns translucent."},{"title":"Clarify","description":"Centrifuge to separate soluble protein (supernatant) from debris/inclusion bodies (pellet)."}]},"submission":{"description":"Lyse an induced culture and keep aliquots of lysate, cleared supernatant and pellet for SDS-PAGE analysis."},"resources":[{"title":"NeoSynBio: Cell Lysis protocols","url":"https://www.neosynbio.com/cell-lysis"},{"title":"Thermo Scientific: Pierce Cell Lysis Technical Handbook","url":"https://tools.thermofisher.com/content/sfs/brochures/1601757-Cell-Lysis-Handbook.pdf"},{"title":"Thermo Fisher: traditional methods of cell lysis","url":"https://www.thermofisher.com/us/en/home/life-science/protein-biology/protein-biology-learning-center/protein-biology-resource-library/pierce-protein-methods/traditional-methods-cell-lysis.html"}]},"centrifuge":{"treeId":"synthetic-biology","id":"centrifuge","title":{"name":"the centrifuge","level":1},"project":"Equipment","video":{"url":""},"time":20,"level":"beginner","overview":{"description":"The high-speed centrifuge is the single most important piece of equipment for the miniprep. Balance is everything - an unbalanced rotor is dangerous and ruins runs.","objectives":["balance a rotor correctly","select g-force vs rpm","pellet cells and clarify lysate"],"prerequisites":["the micropipette node"]},"steps":{"description":"The high-speed centrifuge is the single most important piece of equipment for the miniprep. Balance is everything - an unbalanced rotor is dangerous and ruins runs.","intro":"The high-speed centrifuge is the single most important piece of equipment for the miniprep. Balance is everything - an unbalanced rotor is dangerous and ruins runs.","tools":["microcentrifuge","balanced tubes"],"estimatatedTime":{"setup":3,"config":6,"testing":6},"instructions":[{"title":"Always balance","description":"Place tubes symmetrically; add a water-filled balance tube if you have an odd number."},{"title":"Choose the speed","description":"Convert between rpm and relative centrifugal force (g) for your rotor; use g in protocols."},{"title":"Pellet & decant","description":"Spin to pellet cells/debris, then carefully decant or pipette off the supernatant."}]},"submission":{"description":"Describe a balanced loading scheme for an odd number of samples and the g-force you'd use to pellet E. coli."},"resources":[{"title":"NeoSynBio: Centrifuge equipment guide","url":"https://www.neosynbio.com/centrifuge"},{"title":"Eppendorf: centrifugation basics & rcf/rpm conversion","url":"https://www.eppendorf.com/us-en/lab-academy/"}]},"confirmation":{"treeId":"synthetic-biology","id":"confirmation","title":{"name":"confirmation of edits","level":5},"project":"Screening","video":{"url":"https://www.youtube.com/watch?v=Crv38J3_ZnM"},"time":180,"level":"intermediate","overview":{"description":"Colonies don't equal success - undigested plasmid and contamination produce false positives that look identical to real clones. First check your control plates, then patch-plate and colony-PCR your candidates, and confirm the best ones with a diagnostic digest (or sequencing).","objectives":["verify controls before trusting colonies","run a patch plate + colony PCR to screen candidates","confirm identity by diagnostic restriction digest"],"prerequisites":["colonies on a ligation plate","PCR","primers"]},"steps":{"description":"Colonies don't equal success - undigested plasmid and contamination produce false positives that look identical to real clones. First check your control plates, then patch-plate and colony-PCR your candidates, and confirm the best ones with a diagnostic digest (or sequencing).","intro":"Colonies don't equal success - undigested plasmid and contamination produce false positives that look identical to real clones. First check your control plates, then patch-plate and colony-PCR your candidates, and confirm the best ones with a diagnostic digest (or sequencing).","tools":["fresh antibiotic plate","PCR master mix + screening primers","restriction enzymes","gel kit"],"estimatatedTime":{"setup":30,"config":60,"testing":60},"instructions":[{"title":"Check controls first","description":"Confirm each control plate matches expectations before screening anything."},{"title":"Patch + colony PCR","description":"Number colonies, patch them onto a gridded plate, and colony-PCR each with junction/spanning primers."},{"title":"Gel the screen","description":"Run the colony PCR on a gel; candidates with the expected band advance."},{"title":"Diagnostic digest","description":"Miniprep the best candidates and digest to confirm band sizes match the in-silico map."}]},"submission":{"description":"Submit a colony-PCR gel and a diagnostic-digest gel identifying at least one confirmed correct clone."},"resources":[{"title":"NeoSynBio: Confirmation of Edits","url":"https://www.neosynbio.com/confirmation-of-edits"},{"title":"NeoSynBio: Patch Plate & Colony PCR","url":"https://www.neosynbio.com/patch-plate-colony-pcr"},{"title":"Addgene: Plasmid screening strategies (incl. colony PCR)","url":"https://blog.addgene.org/plasmids-101-plasmid-screening-strategies"},{"title":"Addgene: Verify your clones with colony PCR (Gateway blog)","url":"https://blog.addgene.org/plasmids-101-gateway-cloning"}]},"crispr":{"treeId":"synthetic-biology","id":"crispr","title":{"name":"crispr / cas9","level":6},"project":"Advanced Editing","video":{"url":"https://www.youtube.com/watch?v=2pp17E4E-O8"},"time":180,"level":"advanced","overview":{"description":"CRISPR uses a short guide RNA to direct a Cas enzyme to a ~20 nt target adjacent to a PAM, where it cuts DNA. Repair by NHEJ yields knockouts; an HDR template yields precise edits. The art is choosing a unique target and minimising off-targets.","objectives":["design a specific ~20 nt gRNA with a valid PAM","plan knockout vs knock-in (HDR) experiments","balance on-target activity against off-targets"],"prerequisites":["Ligation/cloning","Primer Design"]},"steps":{"description":"CRISPR uses a short guide RNA to direct a Cas enzyme to a ~20 nt target adjacent to a PAM, where it cuts DNA. Repair by NHEJ yields knockouts; an HDR template yields precise edits. The art is choosing a unique target and minimising off-targets.","intro":"CRISPR uses a short guide RNA to direct a Cas enzyme to a ~20 nt target adjacent to a PAM, where it cuts DNA. Repair by NHEJ yields knockouts; an HDR template yields precise edits. The art is choosing a unique target and minimising off-targets.","tools":["gRNA design tool (CRISPOR/Benchling/SnapGene)","Cas9 plasmid","cloning reagents","(HDR template if knock-in)"],"estimatatedTime":{"setup":30,"config":60,"testing":60},"instructions":[{"title":"Define the edit","description":"Decide knockout (no template) vs precise edit (HDR template)."},{"title":"Design the gRNA","description":"Pick a unique ~20 nt target next to a PAM; score on-/off-target with a design tool."},{"title":"Clone the guide","description":"Insert the gRNA oligos into a Cas9 plasmid (often via Golden Gate)."},{"title":"Deliver & validate","description":"Deliver the Cas9+gRNA into cells and validate the edit by sequencing."}]},"submission":{"description":"Design a validated gRNA (with PAM and off-target assessment) and outline your knockout or knock-in strategy."},"resources":[{"title":"NeoSynBio: CRISPR/Cas9 protocol","url":"https://www.neosynbio.com/crisprcas9"},{"title":"Addgene: CRISPR Guide & 'Plan your experiment'","url":"https://www.addgene.org/guides/crispr/"},{"title":"Addgene: CRISPR references & gRNA design tools","url":"https://www.addgene.org/crispr/reference/"},{"title":"SnapGene: guide to gRNA design for CRISPR","url":"https://www.snapgene.com/guides/design-grna-for-crispr"}]},"culturing-conditions":{"treeId":"synthetic-biology","id":"culturing-conditions","title":{"name":"culturing conditions","level":1},"project":"Experimental Design","video":{"url":"https://www.addgene.org/protocols/streak-plate/"},"time":25,"level":"beginner","overview":{"description":"The secret to adapting any protocol is to KNOW YOUR ORGANISM. If a protocol says 37C but your critter prefers 30C, you can make the expert decision to optimise. An abundance of literature is your friend.","objectives":["identify the optimal growth temperature and media for your host","understand growth curves and morphology","learn to adapt protocols to non-E. coli organisms"],"prerequisites":["a chosen host"]},"steps":{"description":"The secret to adapting any protocol is to KNOW YOUR ORGANISM. If a protocol says 37C but your critter prefers 30C, you can make the expert decision to optimise. An abundance of literature is your friend.","intro":"The secret to adapting any protocol is to KNOW YOUR ORGANISM. If a protocol says 37C but your critter prefers 30C, you can make the expert decision to optimise. An abundance of literature is your friend.","tools":["incubator","hot water bath","literature"],"estimatatedTime":{"setup":4,"config":8,"testing":8},"instructions":[{"title":"Research your organism","description":"Google culture conditions, ideal media, growth curves, morphology - anything that improves your success rate."},{"title":"Standardise E. coli conditions","description":"For E. coli: 37C, shaking ~100-200 rpm for liquid culture, LB media."},{"title":"Document deviations","description":"Record any condition where your organism differs from the default protocol so you can adapt every downstream step."}]},"submission":{"description":"Produce a one-page 'organism profile': optimal temperature, media, doubling time, and any special handling notes."},"resources":[{"title":"NeoSynBio: Common Culturing Conditions","url":"https://www.neosynbio.com/culturing-conditions"},{"title":"Addgene: Inoculating a liquid bacterial culture","url":"https://www.addgene.org/protocols/inoculate-bacterial-culture/"},{"title":"Addgene: Streaking & picking bacterial colonies","url":"https://www.addgene.org/protocols/streak-plate/"}]},"directed-evolution":{"treeId":"synthetic-biology","id":"directed-evolution","title":{"name":"directed evolution","level":7},"project":"Protein Engineering","video":{"url":"https://www.youtube.com/watch?v=FWEN2pxoXoQ"},"time":150,"level":"advanced","overview":{"description":"When you cannot design a protein rationally, evolve it: generate diversity (error-prone PCR, DNA shuffling), then apply selection or screening for the property you want, over iterative rounds. The cardinal rule - you get what you select for - makes assay design the whole game.","objectives":["generate a mutant library (error-prone PCR, saturation mutagenesis, shuffling)","distinguish selection (survival-linked) from screening (measure each variant)","design a selection/screen that couples the desired property to a readout","iterate rounds and avoid selecting for the wrong thing"],"prerequisites":["PCR","Transformation (plasmid insertion)"]},"steps":{"description":"When you cannot design a protein rationally, evolve it: generate diversity (error-prone PCR, DNA shuffling), then apply selection or screening for the property you want, over iterative rounds. The cardinal rule - you get what you select for - makes assay design the whole game.","intro":"Directed evolution is Darwin in a plasmid: the library supplies variation, but the selection pressure decides the outcome - so a sloppy assay evolves a cheater, not a better enzyme.","tools":["error-prone PCR / mutagenesis kit","a large library + high-efficiency transformation","a selection or high-throughput screen","sequencing to track winners"],"estimatatedTime":{"setup":40,"config":80,"testing":40},"instructions":[{"title":"Diversify","description":"Build a library by error-prone PCR, saturation mutagenesis at key residues, or DNA shuffling; size the library to your screen."},{"title":"Couple property to survival/signal","description":"Design a selection (only better variants live) or a screen (measure each clone) that truly reports the property you want."},{"title":"Apply pressure","description":"Select/screen, pick winners, and sequence to see which mutations helped."},{"title":"Iterate","description":"Recombine winners and repeat, tightening stringency each round; watch for artefacts you are inadvertently selecting."}]},"submission":{"description":"Design a directed-evolution campaign for a target property: how you generate diversity, and - critically - the selection/screen that couples that property to a readout without being gamed."},"resources":[{"title":"Directed evolution - overview (Arnold Lab context)","url":"https://www.nobelprize.org/prizes/chemistry/2018/arnold/facts/"},{"title":"Error-prone PCR & library methods (NEB)","url":"https://www.neb.com/en-us/applications/cloning-and-synthetic-biology/site-directed-mutagenesis"}]},"dna101":{"treeId":"synthetic-biology","id":"dna101","title":{"name":"dna101 (theory)","level":2},"project":"Theory","video":{"url":"https://www.youtube.com/watch?v=ni1ajYMQxt8"},"time":45,"level":"beginner","overview":{"description":"This section fills any gaps in DNA theory before you start manipulating it. If you're confident, skim and move on - but a solid mental model of base pairing, polarity and charge underpins every downstream technique.","objectives":["describe DNA structure and antiparallel base pairing","explain why DNA carries a uniform negative charge","use a sequence viewer (Benchling/SnapGene) to read a .dna map"],"prerequisites":["the intro node"]},"steps":{"description":"This section fills any gaps in DNA theory before you start manipulating it. If you're confident, skim and move on - but a solid mental model of base pairing, polarity and charge underpins every downstream technique.","intro":"This section fills any gaps in DNA theory before you start manipulating it. If you're confident, skim and move on - but a solid mental model of base pairing, polarity and charge underpins every downstream technique.","tools":["Benchling or SnapGene","a sample plasmid file"],"estimatatedTime":{"setup":7,"config":15,"testing":15},"instructions":[{"title":"Review structure","description":"Refresh the double helix, 5'->3' polarity, A-T/G-C pairing and the phosphate backbone's negative charge."},{"title":"Open a real plasmid","description":"Download a plasmid (e.g. pET-15b) from Addgene and open it in your viewer to see features, ORIs and restriction sites."},{"title":"Connect theory to charge","description":"Note that each base adds one negative charge - the basis for gel electrophoresis later."}]},"submission":{"description":"Annotate a plasmid map in your viewer, labelling the origin of replication, resistance gene, promoter and multiple cloning site."},"resources":[{"title":"NeoSynBio: DNA101","url":"https://www.neosynbio.com/dna101"},{"title":"Khan Academy: Biology library (DNA structure & replication)","url":"https://www.khanacademy.org/science/biology"},{"title":"Addgene: Molecular Biology Reference","url":"https://www.addgene.org/mol-bio-reference/"},{"title":"Nature Scitable: nucleic acid structure topic room","url":"https://www.nature.com/scitable/topic/genetics-5/"}]},"doe-statistics":{"treeId":"synthetic-biology","id":"doe-statistics","title":{"name":"design of experiments & rigor","level":6},"project":"Methods & Rigor","video":{"url":""},"time":150,"level":"advanced","overview":{"description":"Experimental design and statistics separate a real effect from noise. Design of Experiments (DoE) explores many factors efficiently instead of one-factor-at-a-time; proper replication and controls prevent the p-hacking that fails to reproduce.","objectives":["design a multi-factor experiment (DoE) instead of OFAT","distinguish biological from technical replicates","choose controls and sample size for adequate power","avoid p-hacking / HARKing and pre-specify the analysis"],"prerequisites":["Welcome / intro"]},"steps":{"description":"Experimental design and statistics separate a real effect from noise. Design of Experiments (DoE) explores many factors efficiently instead of one-factor-at-a-time; proper replication and controls prevent the p-hacking that fails to reproduce.","intro":"Rigor is a skill, not a virtue: DoE finds interactions OFAT misses, and honest replication + pre-registration is what makes a result survive someone else repeating it.","tools":["a DoE tool (JMP/Minitab/Python)","a stats environment (R/Python)","a clear hypothesis + analysis plan"],"estimatatedTime":{"setup":40,"config":80,"testing":40},"instructions":[{"title":"State the hypothesis & plan","description":"Pre-specify the question, factors, response, and analysis before collecting data."},{"title":"Design efficiently","description":"Use a factorial/response-surface DoE to vary factors together and detect interactions, instead of one factor at a time."},{"title":"Replicate correctly","description":"Include biological replicates (independent samples) - not just technical replicates - and enough for power."},{"title":"Analyse as planned","description":"Run the pre-specified analysis; report effect sizes and uncertainty, and resist fishing for significance."}]},"submission":{"description":"Take a naive one-factor-at-a-time plan and redesign it as a DoE with proper replication and controls, explaining what the redesign lets you detect that OFAT cannot."},"resources":[{"title":"Design of Experiments - introduction","url":"https://en.wikipedia.org/wiki/Design_of_experiments"},{"title":"NIST/SEMATECH e-Handbook of Statistical Methods","url":"https://www.itl.nist.gov/div898/handbook/"}]},"elisa":{"treeId":"synthetic-biology","id":"elisa","title":{"name":"elisa","level":8},"project":"Proteome Analysis","video":{"url":"https://www.youtube.com/watch?v=RRbuz3VQ100"},"time":180,"level":"advanced","overview":{"description":"ELISA (enzyme-linked immunosorbent assay) quantifies an antigen in solution using antibodies and a colourimetric readout. With a standard curve, it turns a colour change into a concentration.","objectives":["choose direct/indirect/sandwich format","build a standard curve","quantify your antigen"],"prerequisites":["a purified antigen or sample","matched antibodies"]},"steps":{"description":"ELISA (enzyme-linked immunosorbent assay) quantifies an antigen in solution using antibodies and a colourimetric readout. With a standard curve, it turns a colour change into a concentration.","intro":"ELISA (enzyme-linked immunosorbent assay) quantifies an antigen in solution using antibodies and a colourimetric readout. With a standard curve, it turns a colour change into a concentration.","tools":["microplate","capture/detection antibodies","substrate","plate reader"],"estimatatedTime":{"setup":30,"config":60,"testing":60},"instructions":[{"title":"Pick a format","description":"Choose direct, indirect or sandwich ELISA based on your antibodies and sensitivity needs."},{"title":"Coat & block","description":"Immobilise antigen or capture antibody, then block the plate."},{"title":"Detect & quantify","description":"Add detection antibody and substrate, read absorbance, and interpolate against a standard curve."}]},"submission":{"description":"Run (or design) an ELISA with a standard curve and report the calculated concentration of your sample."},"resources":[{"title":"Thermo Fisher: Overview of ELISA","url":"https://www.thermofisher.com/us/en/home/life-science/protein-biology/protein-biology-learning-center/protein-biology-resource-library/pierce-protein-methods/overview-elisa.html"},{"title":"Bio-Rad: ELISA basics & formats","url":"https://www.bio-rad-antibodies.com/elisa-types-direct-indirect-sandwich-competition-elisa-formats.html"}]},"eln-lims":{"treeId":"synthetic-biology","id":"eln-lims","title":{"name":"eln / lims & data hygiene","level":5},"project":"Data & Informatics","video":{"url":""},"time":150,"level":"advanced","overview":{"description":"Electronic lab notebooks (Benchling) and LIMS are the backbone of an industry lab: versioned plasmid maps, sample tracking, inventory, and results tied to metadata. FAIR, well-annotated data is what makes a result reproducible and a candidate employable.","objectives":["keep a versioned, searchable electronic record (Benchling ELN)","track samples, plates, and inventory through a LIMS","annotate data with metadata so it is Findable, Accessible, Interoperable, Reusable (FAIR)","manage plasmid maps and sequences digitally, not in scattered files"],"prerequisites":["Welcome / intro"]},"steps":{"description":"Electronic lab notebooks (Benchling) and LIMS are the backbone of an industry lab: versioned plasmid maps, sample tracking, inventory, and results tied to metadata. FAIR, well-annotated data is what makes a result reproducible and a candidate employable.","intro":"The difference between an academic and an industry lab is often the data discipline: nothing is real until it is recorded, versioned, and findable by someone else.","tools":["Benchling (ELN + molecular biology suite)","a LIMS / sample tracker","consistent naming + metadata schema"],"estimatatedTime":{"setup":40,"config":80,"testing":40},"instructions":[{"title":"Structure the record","description":"Set up an ELN with a consistent experiment template: objective, method, materials (linked), results, conclusion."},{"title":"Track physical samples","description":"Register plasmids, strains, and plates with unique IDs and locations so any tube is traceable."},{"title":"Annotate for FAIR","description":"Attach metadata (conditions, batch, operator, instrument) so data can be reused and audited later."},{"title":"Version everything","description":"Keep sequence/plasmid edits versioned; never overwrite - the history is part of the record."}]},"submission":{"description":"Set up a small ELN/LIMS record for one experiment with linked materials, sample IDs, and FAIR metadata; explain how someone else could reproduce it from your record alone."},"resources":[{"title":"Benchling - ELN & molecular biology platform","url":"https://www.benchling.com/"},{"title":"FAIR data principles (GO FAIR)","url":"https://www.go-fair.org/fair-principles/"}]},"final-project":{"treeId":"synthetic-biology","id":"final-project","title":{"name":"capstone: express & purify a protein","level":8},"project":"Capstone","video":{"url":""},"time":600,"level":"advanced","overview":{"description":"Synthesise everything: pick a target (GFP is ideal - you can literally see success), design and build the construct, transform and confirm it, induce expression, lyse, and purify. This is the bowling-with-bumpers victory lap that proves you're an independent synthetic biologist.","objectives":["integrate every skill from sterile technique to purification","produce a verifiable protein product (e.g. GFP)","document the full workflow reproducibly"],"prerequisites":["the core wet-lab nodes above"]},"steps":{"description":"Synthesise everything: pick a target (GFP is ideal - you can literally see success), design and build the construct, transform and confirm it, induce expression, lyse, and purify. This is the bowling-with-bumpers victory lap that proves you're an independent synthetic biologist.","intro":"Synthesise everything: pick a target (GFP is ideal - you can literally see success), design and build the construct, transform and confirm it, induce expression, lyse, and purify. This is the bowling-with-bumpers victory lap that proves you're an independent synthetic biologist.","tools":["everything from the preceding nodes"],"estimatatedTime":{"setup":100,"config":200,"testing":200},"instructions":[{"title":"Design & build","description":"Design an expression construct and assemble it (RE digest, Gibson, or Golden Gate)."},{"title":"Confirm","description":"Screen and sequence-confirm a correct clone."},{"title":"Express & purify","description":"Induce expression, lyse cells, and affinity-purify the protein."},{"title":"Verify & document","description":"Confirm the product (fluorescence and/or SDS-PAGE) and write up a reproducible protocol."}]},"submission":{"description":"Submit a complete mini lab-report: design rationale, confirmation data, expression/purification gels, and a reproducible protocol."},"resources":[{"title":"NeoSynBio: All Protocols","url":"https://www.neosynbio.com/protocols"},{"title":"iGEM: project & engineering resources","url":"https://technology.igem.org/"},{"title":"Addgene: fluorescent proteins guide (GFP capstone)","url":"https://www.addgene.org/fluorescent-proteins/"},{"title":"Benchling: notebook for documenting your build","url":"https://www.benchling.com/"}]},"flanking-addition":{"treeId":"synthetic-biology","id":"flanking-addition","title":{"name":"flanking sequence addition","level":4},"project":"Amplification","video":{"url":""},"time":60,"level":"intermediate","overview":{"description":"A neat PCR trick: because 3' homology matters far more than 5', you can add whatever you want to the 5' end of a primer. That lets you append restriction sites - or Gibson/Golden Gate overhangs - and even lift genes out of their natural context.","objectives":["exploit that 3' homology matters more than 5'","add sites by designing 5' primer overhangs","'lift' a gene out of a plasmid or environmental sample"],"prerequisites":["Primer Design","PCR"]},"steps":{"description":"A neat PCR trick: because 3' homology matters far more than 5', you can add whatever you want to the 5' end of a primer. That lets you append restriction sites - or Gibson/Golden Gate overhangs - and even lift genes out of their natural context.","intro":"A neat PCR trick: because 3' homology matters far more than 5', you can add whatever you want to the 5' end of a primer. That lets you append restriction sites - or Gibson/Golden Gate overhangs - and even lift genes out of their natural context.","tools":["custom primers with 5' overhangs","PCR reagents"],"estimatatedTime":{"setup":10,"config":20,"testing":20},"instructions":[{"title":"Design the overhang","description":"Keep the 3' end fully complementary to the template; append your new sequence to the 5' end."},{"title":"Amplify","description":"Run PCR - early cycles use only the template-binding region, later cycles incorporate the full primer."},{"title":"Confirm","description":"Gel-check that the product gained the expected length from the added flanks."}]},"submission":{"description":"Add restriction sites (or assembly overhangs) to a fragment by PCR and confirm the size shift on a gel."},"resources":[{"title":"NeoSynBio: Flanking Sequence Addition","url":"https://www.neosynbio.com/flanking-restriction-site-addition"},{"title":"Addgene: Adding restriction sites by PCR (PCR cloning)","url":"https://www.addgene.org/protocols/pcr-cloning/"},{"title":"NEB: designing primers with 5' additions","url":"https://www.neb.com/en-us/tools-and-resources/usage-guidelines"}]},"flow-cytometry":{"treeId":"synthetic-biology","id":"flow-cytometry","title":{"name":"flow cytometry & facs","level":7},"project":"Analytical","video":{"url":"https://www.youtube.com/watch?v=B2zreF2dnWk"},"time":150,"level":"advanced","overview":{"description":"Flow cytometry measures thousands of single cells per second by light scatter and fluorescence, and FACS sorts them. It is the standard tool for immunophenotyping, viability, and screening engineered cells - and demands careful controls and compensation.","objectives":["interpret forward scatter (size) and side scatter (granularity)","gate populations and use FMO / unstained controls","compensate for spectral overlap between fluorophores","design a panel and sort target cells by FACS"],"prerequisites":["Mammalian cell culture"]},"steps":{"description":"Flow cytometry measures thousands of single cells per second by light scatter and fluorescence, and FACS sorts them. It is the standard tool for immunophenotyping, viability, and screening engineered cells - and demands careful controls and compensation.","intro":"Flow data is only as good as its controls: without compensation and proper gating, spectral spillover and debris masquerade as real populations.","tools":["flow cytometer / FACS sorter","fluorophore-conjugated antibodies / reporters","single-stain + FMO controls","analysis software (FlowJo)"],"estimatatedTime":{"setup":40,"config":80,"testing":40},"instructions":[{"title":"Prep a single-cell suspension","description":"Dissociate and filter to avoid clumps; stain with fluorophore-conjugated markers or use a fluorescent reporter."},{"title":"Set scatter gates","description":"Use FSC/SSC to gate cells vs debris and singlets vs doublets before looking at fluorescence."},{"title":"Compensate","description":"Use single-stain controls to correct spectral overlap; use FMO controls to set positive/negative boundaries."},{"title":"Analyse or sort","description":"Quantify populations, or physically sort target cells by FACS for downstream culture/analysis."}]},"submission":{"description":"Design a small flow panel with the controls (unstained, single-stain, FMO) needed to gate and compensate it correctly, and explain what each control rules out."},"resources":[{"title":"Introduction to flow cytometry (Abcam)","url":"https://www.abcam.com/protocols/introduction-to-flow-cytometry"},{"title":"Compensation & controls (BD)","url":"https://www.bdbiosciences.com/en-us/resources/bd-assay-sites/multicolor-flow-cytometry"}]},"gblock-design":{"treeId":"synthetic-biology","id":"gblock-design","title":{"name":"gblock & insert design (theory)","level":3},"project":"Experimental Design","video":{"url":""},"time":60,"level":"intermediate","overview":{"description":"A gBlock is a synthetic DNA strand designed for insertion. Good design front-loads success: pick compatible cut sites, include the transcription/translation machinery, and plan affinity tags now because they're painful to add later.","objectives":["design an insert with correct restriction/assembly sites","add affinity and cleavage tags thoughtfully","apply codon optimisation for your host"],"prerequisites":["Backbone Selection","a sequence viewer"]},"steps":{"description":"A gBlock is a synthetic DNA strand designed for insertion. Good design front-loads success: pick compatible cut sites, include the transcription/translation machinery, and plan affinity tags now because they're painful to add later.","intro":"A gBlock is a synthetic DNA strand designed for insertion. Good design front-loads success: pick compatible cut sites, include the transcription/translation machinery, and plan affinity tags now because they're painful to add later.","tools":["Benchling or SnapGene","a codon-optimisation tool","synthesis vendor"],"estimatatedTime":{"setup":10,"config":20,"testing":20},"instructions":[{"title":"Define the construct","description":"Lay out promoter, RBS, start/stop codons, your gene, and any tags in the correct frame."},{"title":"Add compatible sites","description":"Include restriction sites (or assembly overhangs) that match your chosen backbone and won't cut internally."},{"title":"Codon-optimise","description":"Optimise codons for your host to boost expression, then order the synthesised fragment."}]},"submission":{"description":"Design a complete insert in your viewer, with annotated sites and tags, ready to order. Export the sequence."},"resources":[{"title":"NeoSynBio: gBlock Design","url":"https://www.neosynbio.com/gblock-design"},{"title":"Addgene: Plasmid cloning by PCR (primer & insert design)","url":"https://www.addgene.org/protocols/pcr-cloning/"},{"title":"IDT: gBlocks gene fragments design guidelines","url":"https://www.idtdna.com/pages/products/genes-and-gene-fragments/double-stranded-dna-fragments/gblocks-gene-fragments"},{"title":"Benchling: sequence design tutorials","url":"https://www.benchling.com/the-basics-of-primer-design-for-pcr"}]},"gel-electrophoresis":{"treeId":"synthetic-biology","id":"gel-electrophoresis","title":{"name":"agarose gel electrophoresis","level":3},"project":"Analysis Core","video":{"url":"https://www.youtube.com/watch?v=uAttNVEEEwY"},"time":90,"level":"beginner","overview":{"description":"DNA's uniform negative charge lets an electric field drag it through agarose; smaller fragments run faster. High-% gels resolve large fragments better and low-% gels resolve small ones. Loading is the skill everyone fears - bubbles are your enemy.","objectives":["pour an agarose gel at the right percentage","load samples with running dye without bubbles or tails","size fragments against a DNA ladder","choose a safer stain (e.g. Thiazole Orange) over EtBr"],"prerequisites":["DC power supply","gel tray & bath","agarose","TAE buffer","DNA ladder"]},"steps":{"description":"DNA's uniform negative charge lets an electric field drag it through agarose; smaller fragments run faster. High-% gels resolve large fragments better and low-% gels resolve small ones. Loading is the skill everyone fears - bubbles are your enemy.","intro":"DNA's uniform negative charge lets an electric field drag it through agarose; smaller fragments run faster. High-% gels resolve large fragments better and low-% gels resolve small ones. Loading is the skill everyone fears - bubbles are your enemy.","tools":["agarose","TAE b
